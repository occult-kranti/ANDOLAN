# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Prepared configuration only: no Render service has been created or purchased.
# Review the paid compute plan and disk in Render before creating the Blueprint.
# See docs/MULTIPLAYER_HOSTING.md for verification limits and the launch checks.
services:
  - type: web
    name: andolan-crew-beta
    runtime: docker
    branch: main
    region: oregon
    # Paid plan; the referenced Render example maps standard to 1 CPU / 2 GB RAM.
    # Confirm the current allocation and charges in the Dashboard before creation.
    plan: standard
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /health
    maxShutdownDelaySeconds: 60
    disk:
      name: andolan-room-data
      mountPath: /app/.data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: HOST
        value: 0.0.0.0
      - key: ANDOLAN_DATA_DIR
        value: /app/.data
