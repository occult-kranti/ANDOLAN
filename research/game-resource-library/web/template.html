<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Game resource library</title>
    <style>
      :root {
        --ink: #172d2a;
        --muted: #48605a;
        --paper: #f8f7f0;
        --line: #c7c9bc;
        --accent: #8c361e;
        --surface: #fffef8;
        --dark: #142c28;
        --gold: #efc382;
        font-family: 'DM Sans', system-ui, sans-serif;
        color: var(--ink);
        background: var(--paper);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      [hidden] {
        display: none !important;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button,
      a,
      select,
      input {
        touch-action: manipulation;
      }
      button,
      select {
        cursor: pointer;
      }
      a {
        color: var(--accent);
        text-underline-offset: 0.2em;
      }
      :focus-visible {
        outline: 3px solid #b45a27;
        outline-offset: 3px;
      }
      ::selection {
        background: #f2d4a1;
        color: #162a26;
      }
      .wrap {
        width: min(100% - 64px, 1190px);
        margin-inline: auto;
      }
      .skip {
        position: fixed;
        left: 1rem;
        top: 0;
        z-index: 5;
        background: white;
        padding: 0.8rem;
        transform: translateY(-150%);
      }
      .skip:focus {
        transform: translateY(0);
      }
      .mast {
        background: var(--dark);
        color: #fff8e7;
      }
      .mast .wrap {
        padding-top: 35px;
      }
      h1 {
        font:
          normal 2.7rem/1.12 Georgia,
          serif;
        letter-spacing: -0.025em;
        margin: 0;
      }
      .mast p {
        color: #d3ded4;
        max-width: 64ch;
        line-height: 1.55;
        margin: 0.55rem 0 1.3rem;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 1.75rem;
      }
      nav a {
        color: #d3ded4;
        text-decoration: none;
        padding: 0.75rem 0 0.8rem;
        border-bottom: 3px solid transparent;
        font-weight: 600;
        font-size: 0.94rem;
      }
      nav a[aria-current='page'] {
        color: #ffe0a8;
        border-color: var(--gold);
      }
      nav a:hover {
        color: white;
      }
      main {
        padding: 30px 0 48px;
      }
      .search-box {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        border: 1px solid #85968c;
        border-radius: 4px;
        background: var(--surface);
        padding: 0 1rem;
        max-width: 100%;
      }
      .search-box:focus-within {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .search-box svg {
        width: 20px;
        flex: none;
      }
      #search {
        border: none;
        outline: none;
        background: transparent;
        width: 100%;
        padding: 0.88rem 0;
        min-width: 0;
        font-size: 1.02rem;
      }
      #search::placeholder {
        color: #68766d;
      }
      kbd {
        font: inherit;
        font-size: 0.86rem;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 0 0.35rem;
      }
      .layout {
        display: grid;
        grid-template-columns: 216px minmax(0, 1fr);
        gap: clamp(1.4rem, 4vw, 3.6rem);
        margin-top: 1.7rem;
        align-items: start;
      }
      h2 {
        margin: 0;
        font-size: 1.18rem;
        font-weight: 680;
        line-height: 1.35;
      }
      .filters h2,
      .summary {
        padding-bottom: 0.68rem;
        border-bottom: 1px solid var(--line);
      }
      .filters label {
        display: block;
        margin: 1rem 0 0.34rem;
        color: var(--muted);
        font-size: 0.88rem;
        font-weight: 650;
      }
      .filters select {
        width: 100%;
        min-width: 0;
        padding: 0.49rem 0.3rem 0.49rem 0.6rem;
        border: 1px solid #aeb8ab;
        border-radius: 3px;
        background: var(--surface);
        line-height: 1.3;
      }
      .text-button {
        background: none;
        border: 0;
        padding: 0.52rem 0;
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 0.19em;
      }
      #reset {
        margin-top: 0.55rem;
      }
      #reset:disabled {
        color: var(--muted);
        opacity: 0.63;
        text-decoration: none;
        cursor: default;
      }
      .summary {
        display: flex;
        gap: 0.7rem;
        align-items: baseline;
        justify-content: space-between;
      }
      .summary span {
        color: var(--muted);
        font-size: 0.88rem;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      #results {
        padding: 0;
        margin: 0;
        list-style: none;
      }
      #results li {
        border-bottom: 1px solid var(--line);
      }
      .record {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(85px, 19%) 16px;
        gap: 14px;
        align-items: center;
        width: 100%;
        padding: 1.05rem 0.4rem 1rem 0;
        text-align: left;
        color: inherit;
        text-decoration: none;
        line-height: 1.45;
        border-radius: 2px;
      }
      .record:hover,
      .record:focus-visible {
        background: #eeeee3;
      }
      .record:hover .name {
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 0.17em;
      }
      .record.with-preview {
        grid-template-columns: 52px minmax(0, 1fr) minmax(85px, 19%) 16px;
      }
      .record img,
      .asset-preview {
        object-fit: contain;
        background: #29403b;
        border-radius: 3px;
      }
      .record img {
        width: 52px;
        height: 52px;
      }
      .asset-preview {
        width: min(128px, 100%);
        height: auto;
        display: block;
        margin: 1rem 0;
      }
      .button-sheet {
        margin: 1rem 0;
      }
      .button-sheet img {
        display: block;
        max-width: 100%;
        height: auto;
      }
      .button-sheet figcaption {
        color: var(--muted);
        font-size: .875rem;
        line-height: 1.5;
        margin-top: .45rem;
      }
      .copy {
        display: grid;
        gap: 0.14rem;
        min-width: 0;
      }
      .name {
        font-weight: 675;
        font-size: 1.06rem;
        color: var(--ink);
        overflow-wrap: anywhere;
      }
      .meta,
      .excerpt,
      .record-side {
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .meta,
      .record-side {
        font-size: 0.82rem;
      }
      .excerpt {
        font-size: 0.91rem;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .record-side {
        text-align: right;
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .arrow {
        width: 14px;
        height: 14px;
        justify-self: end;
        color: var(--accent);
      }
      #empty {
        margin: 1.8rem 0;
        line-height: 1.6;
      }
      #empty p {
        margin: 0.28rem 0;
      }
      .pages {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 0.65rem;
        margin-top: 1rem;
      }
      .pages span {
        margin-right: auto;
        color: var(--muted);
        font-size: 0.88rem;
      }
      .control {
        border: 1px solid #9cae9e;
        border-radius: 3px;
        background: var(--surface);
        padding: 0.48rem 0.8rem;
        line-height: 1.35;
      }
      .control:hover {
        background: #eceee2;
      }
      .control:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
      dialog {
        background: var(--paper);
        color: var(--ink);
        border: 0;
        border-left: 1px solid #a7b3a9;
        margin: 0 0 0 auto;
        padding: 0;
        width: min(100%, 650px);
        max-width: 100%;
        height: 100%;
        max-height: 100%;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      dialog::backdrop {
        background: rgb(13 31 27 / 55%);
      }
      .panel {
        padding: 0 clamp(1.2rem, 4vw, 2.4rem) 2.5rem;
      }
      .panel-tools {
        position: sticky;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem 0;
        background: var(--paper);
        border-bottom: 1px solid var(--line);
        z-index: 1;
      }
      #detail-type {
        font-size: 0.85rem;
        font-weight: 650;
        color: var(--muted);
      }
      #detail-title {
        font:
          normal 2rem/1.12 Georgia,
          serif;
        letter-spacing: -0.02em;
        margin: 1.4rem 0 0.65rem;
        overflow-wrap: anywhere;
      }
      #detail-body {
        overflow-wrap: anywhere;
      }
      #detail-body p {
        margin: 0.4rem 0 1rem;
        line-height: 1.59;
        white-space: pre-line;
      }
      #detail-body h3 {
        font-size: 1.04rem;
        margin: 1.45rem 0 0.4rem;
        padding-top: 0.9rem;
        border-top: 1px solid var(--line);
      }
      #detail-body dl {
        margin: 0.7rem 0;
        display: grid;
        grid-template-columns: minmax(78px, 27%) minmax(0, 1fr);
        gap: 0.42rem 0.9rem;
        line-height: 1.47;
      }
      dt {
        color: var(--muted);
        font-size: 0.88rem;
      }
      dd {
        margin: 0;
      }
      code {
        font-family: ui-monospace, monospace;
        font-size: 0.88em;
      }
      #detail-body ul {
        padding-left: 1.2rem;
        line-height: 1.55;
        margin: 0.4rem 0;
      }
      #detail-body li + li {
        margin-top: 0.3rem;
      }
      .panel-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-top: 1.3rem;
      }
      #copy-feedback {
        font-size: 0.87rem;
        color: var(--muted);
      }
      #copy-value {
        width: 100%;
        padding: 0.5rem;
        background: var(--surface);
        border: 1px solid var(--line);
      }
      @media (max-width: 720px) {
        .wrap {
          width: calc(100% - 32px);
        }
        .mast .wrap {
          padding-top: 22px;
        }
        h1 {
          font-size: 2.05rem;
        }
        .mast p {
          font-size: 0.94rem;
          margin-bottom: 0.7rem;
        }
        main {
          padding-top: 18px;
        }
        .layout {
          grid-template-columns: 1fr;
          gap: 1.15rem;
          margin-top: 1rem;
        }
        .filters {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(min(125px, 100%), 1fr));
          gap: 0.4rem 0.65rem;
          align-items: end;
        }
        .filters h2 {
          grid-column: 1/-1;
          border: 0;
          padding: 0;
          font-size: 1rem;
        }
        .filters label {
          margin: 0.22rem 0;
        }
        .filters #reset {
          align-self: end;
          justify-self: start;
        }
        .summary {
          padding-bottom: 0.5rem;
        }
        .record {
          gap: 0.55rem;
          padding: 0.8rem 0;
        }
        .record-side {
          font-size: 0.78rem;
        }
        .panel {
          padding-inline: 1rem;
        }
      }
      @media (max-width: 480px) {
        nav {
          gap: 1rem;
        }
        nav a {
          font-size: 0.86rem;
        }
        .search-box kbd {
          display: none;
        }
        .record {
          grid-template-columns: minmax(0, 1fr) 16px;
        }
        .record-side {
          display: none;
        }
        .summary span {
          font-size: 0.78rem;
        }
      }
      #results.contact-sheet {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(136px, 1fr));
        gap: 0 1rem;
      }
      .contact-sheet .record {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
        gap: .55rem;
        height: 100%;
        padding: 1rem 0;
      }
      .contact-sheet .record img {
        width: 76px;
        height: 76px;
      }
      .contact-sheet .record .name { font-size: .96rem; }
      .contact-sheet .arrow, .contact-sheet .excerpt { display: none; }
      .contact-sheet .record-side { margin-top: auto; text-align: left; }
      .missing-preview {
        display: grid;
        place-content: center;
        width: 76px;
        height: 76px;
        padding: .3rem;
        border: 1px dashed var(--line);
        color: var(--muted);
        font-size: .72rem;
        text-align: center;
      }
      @media(max-width:480px) {
        .mast nav { gap: 0 .6rem; }
        .mast nav a { font-size: .8rem; }
      }
      @media print {
        .mast {
          color: #142c28;
          background: white;
        }
        .mast p {
          color: inherit;
        }
        nav,
        .search-box,
        .filters,
        .pages,
        .skip,
        .panel-tools,
        .panel-actions {
          display: none !important;
        }
        .layout {
          display: block;
        }
        dialog[open] {
          position: static;
          height: auto;
          overflow: visible;
          width: 100%;
          border: 0;
        }
        body:has(dialog[open]) > header,
        body:has(dialog[open]) > main {
          display: none;
        }
      }
      @media (max-width: 480px) {
        .record.with-preview {
          grid-template-columns: 44px minmax(0, 1fr) 16px;
        }
        .record img {
          width: 44px;
          height: 44px;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#search">Skip to search</a>
    <header class="mast">
      <div class="wrap">
        <h1>Game resource library</h1>
        <p id="collection-note">Search game art, tools and code by file, revision and reuse terms.</p>
        <nav aria-label="Library collections">
          <a href="#elements" id="elements-tab" aria-current="page">Verified elements</a
          ><a href="#assets" id="assets-tab">Asset files</a
          ><a href="#projects" id="projects-tab">Discovery projects</a>
        </nav>
      </div>
    </header>
    <main class="wrap">
      <label class="search-box" for="search"
        ><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7">
          <circle cx="10.5" cy="10.5" r="6.7" />
          <path d="m16 16 5 5" /></svg
        ><span class="sr" id="search-label">Search verified elements</span
        ><input
          type="search"
          id="search"
          placeholder="Search names, files, tools or techniques"
          autocomplete="off"
        /><kbd aria-hidden="true">/</kbd></label
      >
      <div class="layout">
        <aside class="filters" aria-labelledby="filter-title">
          <h2 id="filter-title">Filters</h2>
          <div>
            <label for="category">Category</label
            ><select id="category"></select>
          </div>
          <div>
            <label for="stack">Stack</label
            ><select id="stack"></select>
          </div>
          <div>
            <label for="use">Reuse status</label
            ><select id="use"></select>
          </div>
          <div hidden>
            <label for="kind">Project kind</label
            ><select id="kind"></select>
          </div>
          <div hidden>
            <label for="language">Language</label
            ><select id="language"></select>
          </div>
          <div hidden>
            <label for="asset-kind">Asset type</label
            ><select id="asset-kind"></select>
          </div>
          <div hidden>
            <label for="asset-license">Asset license</label
            ><select id="asset-license"></select>
          </div>
          <button type="button" class="text-button" id="reset">Clear all</button>
        </aside>
        <section aria-labelledby="results-title">
          <div class="summary">
            <h2 id="results-title" tabindex="-1">Verified elements</h2>
            <span id="result-count" role="status" aria-live="polite"></span>
          </div>
          <ul id="results"></ul>
          <div id="empty" hidden>
            <strong>No matches</strong>
            <p>Try a broader search or clear the filters.</p>
            <button class="control" id="empty-reset">Clear search and filters</button>
          </div>
          <div class="pages" id="pages" hidden>
            <span id="page-label"></span><button class="control" id="prev">Previous</button
            ><button class="control" id="next">Next</button>
          </div>
        </section>
      </div>
      <noscript>Enable JavaScript to search the embedded resource library.</noscript>
    </main>
    <dialog id="detail" aria-labelledby="detail-title">
      <div class="panel">
        <div class="panel-tools">
          <span id="detail-type"></span><button class="control" id="close-detail" autofocus>Close</button>
        </div>
        <h2 id="detail-title"></h2>
        <div id="detail-body"></div>
        <div class="panel-actions">
          <button class="control" id="copy-link">Copy link</button
          ><span id="copy-feedback" role="status"></span
          ><input id="copy-value" aria-label="Reference to copy" readonly hidden />
        </div>
      </div>
    </dialog>
    <script id="resource-data" type="application/json">
      /* RESOURCE_DATA */
    </script>
    <script>
      'use strict';
      const $ = (id) => document.getElementById(id);
      const catalog = JSON.parse($('resource-data').textContent);
      const datasets = {
        elements: catalog.elements,
        projects: catalog.projects,
        assets: catalog.assets ?? [],
      };
      const labels = { elements: 'Verified elements', projects: 'Discovery projects', assets: 'Asset files' };
      const singular = { elements: 'element', projects: 'project', assets: 'asset' };
      const fields = {
        elements: ['category', 'stack', 'use'],
        projects: ['kind', 'language'],
        assets: ['asset-kind', 'asset-license'],
      };
      const defaults = {
        category: 'All categories',
        stack: 'All stacks',
        use: 'All reuse statuses',
        kind: 'All kinds',
        language: 'All languages',
        'asset-kind': 'All types',
        'asset-license': 'All licenses',
      };
      const views = {};
      const PAGE_SIZE = 30;
      let view = 'elements',
        initialized = false,
        detailOpener = null;
      const dialog = $('detail');
      const node = (name, text, cls) => {
        const e = document.createElement(name);
        if (text !== undefined && text !== null) e.textContent = text;
        if (cls) e.className = cls;
        return e;
      };
      const list = (value) =>
        Array.isArray(value)
          ? value.filter((v) => typeof v === 'string' && v.trim())
          : typeof value === 'string' && value.trim()
            ? [value]
            : [];
      const words = (value) => list(value).join(' · ');
      function values(r, f) {
        if (f === 'asset-kind') return list(r.kind);
        if (f === 'asset-license') return list(r.license);
        if (f !== 'language') return list(r[f]);
        const languages = list(r.languages);
        return languages.length
          ? languages
          : list(r.language).flatMap((l) =>
              l
                .split(',')
                .map((s) => s.trim())
                .filter(Boolean),
            );
      }
      const keyOf = (r) => String(r.id ?? r.name);
      const clean = (v) =>
        String(v ?? '')
          .normalize('NFKD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase();
      const display = (v) => String(v).replace(/[_-]+/g, ' ');
      const facetLabel = (f, v) => {
        if (f === 'category') return v === 'ui' ? 'UI' : v.charAt(0).toUpperCase() + v.slice(1);
        return f === 'use'
          ? ({ adapt: 'Adapt', study: 'Study', 'verify-terms': 'Verify terms' }[v] ?? display(v))
          : v;
      };
      const formatCount = (n) => n.toLocaleString();
      const hashFor = (v, r) => '#' + singular[v] + '/' + encodeURIComponent(keyOf(r));
      function embeddedImage(data, cls) {
        if (typeof data !== 'string' || !/^data:image\/(webp|png|jpeg);base64,[a-z0-9+/]+=*$/i.test(data))
          return null;
        const img = node('img', null, cls);
        img.alt = '';
        img.loading = 'lazy';
        img.src = data;
        return img;
      }
      function external(raw, label) {
        try {
          const u = new URL(raw);
          if ((u.protocol === 'https:' || u.protocol === 'http:') && !u.username && !u.password) {
            const a = node('a', label);
            a.href = u.href;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            return a;
          }
        } catch {}
        return null;
      }
      const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      arrow.setAttribute('viewBox', '0 0 16 16');
      arrow.setAttribute('class', 'arrow');
      arrow.setAttribute('aria-hidden', 'true');
      const path = document.createElementNS(arrow.namespaceURI, 'path');
      path.setAttribute('d', 'm5 2.5 5.5 5.5L5 13.5');
      path.setAttribute('fill', 'none');
      path.setAttribute('stroke', 'currentColor');
      path.setAttribute('stroke-width', '1.5');
      arrow.append(path);
      const indices = {};
      for (const v of Object.keys(datasets)) {
        const records = [...datasets[v]].sort((a, b) => String(a.name).localeCompare(String(b.name), 'en'));
        const searchText = new Map(),
          byId = new Map();
        const options = Object.fromEntries(fields[v].map((f) => [f, new Set()]));
        for (const r of records) {
          const k = keyOf(r);
          byId.set(k, r);
          const text = [
            r.id,
            r.name,
            r.project,
            r.path,
            r.symbol,
            r.kind,
            r.category,
            r.summary,
            r.adaptation,
            r.evidence,
            r.license,
            r.rights_note,
            r.use,
            r.stack,
            r.formats,
            r.tags,
            r.language,
            r.languages,
            r.genres,
            r.platforms,
            r.status,
            r.url,
            r.originals,
            r.content,
            r.listed_licenses,
            r.development,
            r.aliases,
            r.author,
            r.clips,
            r.extensions,
            ...(r.sources ?? []).map((s) => (typeof s === 'string' ? s : s.name)),
          ]
            .flatMap(list)
            .join(' ');
          searchText.set(k, clean(text));
          for (const f of fields[v]) for (const item of values(r, f)) options[f].add(item);
        }
        indices[v] = { records, byId, searchText };
        views[v] = { query: '', filters: {}, page: 0 };
        for (const f of fields[v]) {
          const select = $(f);
          select.add(new Option(defaults[f], ''));
          for (const value of [...options[f]].sort((a, b) => a.localeCompare(b, 'en')))
            select.add(new Option(facetLabel(f, value), value));
        }
      }
      function clearFilters() {
        Object.assign(views[view], { query: '', filters: {}, page: 0 });
        syncControls();
        render();
      }
      function syncControls() {
        const state = views[view];
        $('search').value = state.query;
        $('search-label').textContent = 'Search ' + labels[view].toLowerCase();
        $('search').placeholder = {
          elements: 'Search names, files, tools or techniques',
          projects: 'Search project names, languages or genres',
          assets: 'Search assets, artists, tags or animation clips',
        }[view];
        for (const v of Object.keys(fields)) {
          const tab = $(v + '-tab');
          if (v === view) tab.setAttribute('aria-current', 'page');
          else tab.removeAttribute('aria-current');
          for (const f of fields[v]) {
            const select = $(f);
            select.parentElement.hidden = v !== view;
            if (v === view) select.value = state.filters[f] ?? '';
          }
        }
        $('results-title').textContent = labels[view];
        $('collection-note').textContent = {
          elements: 'Search game art, tools and code by file, revision and reuse terms.',
          projects:
            'Browse projects from game catalogs. Follow their original listings and inspect available source files.',
          assets: 'Find individual icons and 3D models by author, license or animation clip.',
        }[view];
      }
      function render() {
        const state = views[view],
          idx = indices[view],
          terms = clean(state.query.trim()).split(/\s+/).filter(Boolean);
        const matches = idx.records.filter((r) => {
          const text = idx.searchText.get(keyOf(r));
          return (
            terms.every((word) => text.includes(word)) &&
            fields[view].every((f) => !state.filters[f] || values(r, f).includes(state.filters[f]))
          );
        });
        const pages = Math.max(1, Math.ceil(matches.length / PAGE_SIZE));
        state.page = Math.min(pages - 1, Math.max(0, state.page));
        const first = state.page * PAGE_SIZE,
          end = Math.min(matches.length, first + PAGE_SIZE);
        const gallery = view === 'assets' && matches.length > 0 &&
          (state.filters['asset-kind'] === 'Icon' || matches.every(r => r.kind === 'Icon'));
        $('results').classList.toggle('contact-sheet', gallery);
        const fragment = document.createDocumentFragment();
        for (const r of matches.slice(first, end)) {
          const item = node('li'),
            a = node('a', null, 'record'),
            copy = node('span', null, 'copy');
          a.href = hashFor(view, r);
          const project = view === 'projects',
            asset = view === 'assets';
          copy.append(node('span', r.name, 'name'));
          const meta = project
            ? [...list(r.kind), ...values(r, 'language')]
            : asset
              ? [r.kind, r.author || r.project]
              : [r.project, facetLabel('category', r.category)];
          copy.append(node('span', meta.filter(Boolean).join(' · '), 'meta'));
          const desc = project ? words(r.genres) : r.summary;
          if (desc) copy.append(node('span', desc, 'excerpt'));
          const side = project ? words(r.platforms) : asset ? r.license : facetLabel('use', words(r.use));
          const thumb = asset && embeddedImage(r.preview_data);
          if (thumb) {
            a.classList.add('with-preview');
            a.append(thumb);
          } else if (gallery) {
            a.append(node('span', 'Preview unavailable', 'missing-preview'));
          }
          a.append(copy, node('span', side, 'record-side'), arrow.cloneNode(true));
          item.append(a);
          fragment.append(item);
        }
        $('results').replaceChildren(fragment);
        const noun = singular[view];
        $('result-count').textContent =
          formatCount(matches.length) + ' ' + noun + (matches.length === 1 ? '' : 's');
        $('reset').disabled = !state.query && !Object.values(state.filters).some(Boolean);
        $('empty').hidden = matches.length > 0;
        $('pages').hidden = pages < 2;
        $('page-label').textContent =
          formatCount(first + 1) + '–' + formatCount(end) + ' of ' + formatCount(matches.length);
        $('prev').disabled = state.page === 0;
        $('next').disabled = state.page + 1 === pages;
      }
      function paginate(change) {
        views[view].page += change;
        render();
        $('results-title').focus();
      }
      $('prev').onclick = () => paginate(-1);
      $('next').onclick = () => paginate(1);
      $('reset').onclick = clearFilters;
      $('empty-reset').onclick = () => {
        clearFilters();
        $('search').focus();
      };
      $('search').addEventListener('input', () => {
        views[view].query = $('search').value;
        views[view].page = 0;
        render();
      });
      for (const f of Object.keys(defaults))
        $(f).onchange = () => {
          views[view].filters[f] = $(f).value;
          views[view].page = 0;
          render();
        };
      document.querySelector('.skip').onclick = (e) => {
        e.preventDefault();
        $('search').focus();
      };
      function heading(parent, title) {
        parent.append(node('h3', title));
      }
      function paragraph(parent, value) {
        if (value) parent.append(node('p', value));
      }
      function definition(parent, pairs) {
        const dl = node('dl');
        for (const [name, value, code] of pairs)
          if (value) {
            const dd = node('dd');
            dd.append(value instanceof Node ? value : node(code ? 'code' : 'span', value));
            dl.append(node('dt', name), dd);
          }
        if (dl.children.length) parent.append(dl);
      }
      function detailContent(r) {
        const body = $('detail-body');
        body.replaceChildren();
        $('detail-title').textContent = r.name;
        $('detail-type').textContent = {
          elements: 'Verified element',
          projects: 'Discovery project',
          assets: 'Asset file',
        }[view];
        if (view === 'elements') {
          paragraph(body, r.summary);
          const sheet = catalog.buttonSheet;
          if (Array.isArray(sheet?.ids) && sheet.ids.includes(r.id)) {
            const image = embeddedImage(sheet.image);
            if (image) {
              image.alt = sheet.label || 'Button state comparison';
              const figure = node('figure', null, 'button-sheet');
              figure.append(image);
              if (sheet.credits) figure.append(node('figcaption', sheet.credits));
              const download = node('a', 'Save full-size sheet');
              download.href = image.src;
              download.download = 'button-state-reference.png';
              figure.append(download);
              body.append(figure);
            }
          }
          const project = indices.projects.byId.get(r.project_id);
          const projectLink = project ? node('a', r.project) : r.project;
          if (project) projectLink.href = hashFor('projects', project);
          definition(body, [
            ['Project', projectLink],
            ['Category', r.category],
            ['Type', r.kind],
            ['Stack', words(r.stack)],
            ['Formats', words(r.formats)],
            ['Tags', words(r.tags)],
          ]);
          if (r.adaptation) {
            heading(body, 'How to adapt it');
            paragraph(body, r.adaptation);
          }
          heading(body, 'Source evidence');
          definition(body, [
            ['Evidence', display(r.evidence)],
            ['Source file', external(r.source_url, r.path || 'Open source file') ?? r.path, true],
            ['Symbol', words(r.symbol), true],
            ['Revision', r.revision, true],
            ['SHA-256', r.sha256, true],
          ]);
          heading(body, 'License and reuse');
          definition(body, [
            ['Reuse status', display(words(r.use))],
            ['License', r.license],
            [
              'License file',
              external(r.license_url, r.license_path || 'Read license') ?? r.license_path,
              true,
            ],
          ]);
          paragraph(body, r.rights_note);
        } else if (view === 'assets') {
          const image = embeddedImage(r.preview_data, 'asset-preview');
          if (image) {
            image.alt = r.name + ' preview';
            body.append(image);
          }
          paragraph(body, r.summary);
          definition(body, [
            ['Project', r.project],
            ['Type', r.kind],
            ['Artist', r.author],
            ['Tags', words(r.tags)],
            ['Preview', external(r.preview_url, 'Open source preview')],
          ]);
          if (r.evidence === 'svg-inspected') {
            heading(body, 'Vector contents');
            definition(body, [
              ['ViewBox', Array.isArray(r.dimensions) && r.dimensions.join(' ')],
              ['Paths', Number.isInteger(r.paths) && formatCount(r.paths)],
              ['Circles', Number.isInteger(r.circles) && formatCount(r.circles)],
              ['File size', Number.isInteger(r.bytes) && formatCount(r.bytes) + ' bytes'],
            ]);
          }
          const countEntries = Object.entries(r.counts ?? {}).filter(([, v]) => Number.isFinite(v));
          if (countEntries.length || r.clips?.length || r.extensions?.length) {
            heading(body, 'Model contents');
            const important = ['meshes', 'materials', 'skins', 'joints', 'animations'];
            definition(
              body,
              countEntries.filter(([k]) => important.includes(k)).map(([k,v]) => [display(k), formatCount(v)]),
            );
            if (r.clips?.length) {
              const names = r.clips.map((c, i) =>
                typeof c === 'string' && c.trim() ? c : 'Unnamed clip ' + (i + 1),
              );
              definition(body, [['Animation clips', names.join(', ')]]);
            }
            const metrics = node('details');
            metrics.append(node('summary', 'Descriptor details'));
            definition(metrics, countEntries.filter(([k]) => !important.includes(k)).map(([k,v]) => [display(k), formatCount(v)]));
            definition(metrics, [
              ['Extensions', words(r.extensions)],
              ['Animated properties', words(r.animated_properties)],
            ]);
            body.append(metrics);
          }
          heading(body, 'Source evidence');
          definition(body, [
            ['Evidence', r.evidence && display(r.evidence)],
            ['Source file', external(r.source_url, r.path || 'Open file') ?? r.path],
            ['Revision', r.revision, true],
            ['SHA-256', r.sha256, true],
            ['Catalog metadata', external(r.metadata_url, 'Read model metadata')],
          ]);
          if (r.variants && /^[\w.-]+\/[\w.-]+$/.test(r.project) && /^[a-f0-9]{40}$/.test(r.revision)) {
            const variants = [];
            for (const [format, path] of Object.entries(r.variants)) {
              if (typeof path !== 'string' || path.startsWith('/') || path.split('/').includes('..')) continue;
              const url = 'https://github.com/' + r.project + '/blob/' + r.revision + '/' + path.split('/').map(encodeURIComponent).join('/');
              variants.push([format, external(url, path)]);
            }
            if (variants.length) {
              const files = node('details');
              files.append(node('summary', 'Source variants'));
              definition(files, variants);
              body.append(files);
            }
          }
          heading(body, 'License and credits');
          definition(body, [
            ['License', external(r.license_url, r.license || 'Read license') ?? r.license],
            ['License terms', external(r.terms_url, 'Read terms')],
          ]);
          paragraph(body, r.rights_note);
          if (r.credits?.length) {
            const credits = node('ul');
            for (const credit of r.credits) {
              const text =
                typeof credit === 'string'
                  ? credit
                  : [credit.what, credit.artist, credit.owner, credit.year, credit.spdx]
                      .filter(Boolean)
                      .join(' · ');
              if (text) {
                const row = node('li');
                row.append(external(credit.terms_url || credit.url, text) ?? node('span', text));
                credits.append(row);
              }
            }
            if (credits.children.length) body.append(credits);
          }
        } else {
          definition(body, [
            ['Project', external(r.url, 'Open project')],
            ['Type', words(r.kind)],
            ['Languages', values(r, 'language').join(', ')],
            ['Based on', words(r.originals)],
            ['Also listed as', words(r.aliases)],
            ['Platforms', words(r.platforms)],
            ['Genres', words(r.genres)],
            ['Status', words(r.status)],
            ['Development', words(r.development)],
            ['Content', words(r.content)],
            ['Catalog license', words(r.listed_licenses)],
          ]);
          if ((r.sources ?? []).length) {
            heading(body, 'Catalog sources');
            const links = node('ul');
            for (const s of r.sources) {
              const name = typeof s === 'string' ? s : s.name || s.url || 'Source';
              const dest = typeof s === 'string' ? s : s.url;
              const li = node('li');
              li.append(external(dest, name) ?? node('span', name));
              links.append(li);
            }
            body.append(links);
          }
          const url = String(r.url ?? '')
            .replace(/\/$/, '')
            .toLowerCase();
          const proven = indices.elements.records.filter(
            (e) =>
              e.project_id === r.id ||
              e.project === r.name ||
              (url && url === 'https://github.com/' + String(e.project).toLowerCase()),
          );
          if (proven.length) {
            heading(body, 'Verified elements in this project');
            const ul = node('ul');
            for (const e of proven) {
              const li = node('li'),
                a = node('a', e.name);
              a.href = hashFor('elements', e);
              li.append(a);
              ul.append(li);
            }
            body.append(ul);
          }
        }
        $('copy-feedback').textContent = '';
        $('copy-value').hidden = true;
        $('copy-link').textContent = location.protocol === 'file:' ? 'Copy reference' : 'Copy link';
      }
      function route() {
        const fragment = location.hash.slice(1),
          split = fragment.indexOf('/');
        const section = split < 0 ? fragment : fragment.slice(0, split);
        const dest =
          Object.keys(singular).find((v) => section === v || section === singular[v]) ?? 'elements';
        let id = '';
        if (split >= 0 && section === singular[dest]) {
          try {
            id = decodeURIComponent(fragment.slice(split + 1));
          } catch {}
        }
        if (view !== dest || !initialized) {
          view = dest;
          initialized = true;
          syncControls();
          render();
        }
        const record = id && indices[view].byId.get(id);
        if (record) {
          detailContent(record);
          document.title = record.name + ' · Game resource library';
          if (!dialog.open) {
            detailOpener = document.activeElement;
            dialog.showModal();
          }
          dialog.scrollTop = 0;
          $('close-detail').focus({ preventScroll: true });
        } else {
          document.title = labels[view] + ' · Game resource library';
          if (dialog.open) {
            dialog.close();
            if (detailOpener?.isConnected && detailOpener !== document.body)
              detailOpener.focus({ preventScroll: true });
            else $('results-title').focus();
            detailOpener = null;
          }
          if (id) $('result-count').textContent = 'Reference unavailable in this edition.';
        }
      }
      function closeDetail() {
        // Detail links entered through the index return to that exact history entry.
        if (history.state?.libraryDetail) history.back();
        else {
          history.replaceState(null, '', '#' + view);
          route();
        }
      }
      $('results').addEventListener('click', (e) => {
        const a = e.target.closest('a.record');
        if (!a || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        e.preventDefault();
        a.focus({ preventScroll: true });
        history.pushState({ libraryDetail: true }, '', a.hash);
        route();
      });
      dialog.addEventListener('cancel', (e) => {
        e.preventDefault();
        closeDetail();
      });
      $('close-detail').onclick = closeDetail;
      $('copy-link').onclick = async () => {
        const link = location.protocol === 'file:' ? location.hash : location.href;
        try {
          await navigator.clipboard.writeText(link);
          $('copy-feedback').textContent = 'Copied.';
        } catch {
          const input = $('copy-value');
          input.value = link;
          input.hidden = false;
          input.focus();
          input.select();
          $('copy-feedback').textContent = 'Copy the selected reference.';
        }
      };
      window.addEventListener('hashchange', route);
      document.addEventListener('keydown', (e) => {
        if (
          e.key === '/' &&
          !dialog.open &&
          !e.ctrlKey &&
          !e.metaKey &&
          !e.altKey &&
          !e.shiftKey &&
          !e.target.closest('input,textarea,select,[contenteditable="true"]')
        ) {
          e.preventDefault();
          $('search').focus();
        }
      });
      route();
    </script>
  </body>
</html>
