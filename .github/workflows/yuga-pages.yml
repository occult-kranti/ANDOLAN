name: Verify and deploy YUGA Confluence
on:
  push:
    branches: [game/yuga-confluence]
    paths-ignore: ["games/yuga/docs/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
env:
  NPM_CONFIG_CACHE: /tmp/yuga-npm
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run yuga:typecheck && npm run lint && npm test && npm run yuga:test
      - run: npm run yuga:assets
      - run: npx playwright install --with-deps chromium
      - run: npm run yuga:e2e
      - name: Preserve YUGA browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yuga-browser-test-report
          path: |
            playwright-report/yuga/
            test-results/yuga/
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run build:standalone && npm run yuga:build && node games/yuga/tools/assemble-site.mjs
      - run: npm run yuga:smoke:production
      - name: Preserve production browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yuga-production-browser-report
          path: test-results/yuga-production/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}yuga/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy both games
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
