name: YUGA native foundation

on:
  push:
    branches: [game/yuga-native-production]
    paths:
      - 'games/yuga-native/**'
      - 'games/yuga/shared/**'
      - 'games/yuga/server/**'
      - 'games/yuga/tests/projectile-lifetime.test.ts'
      - 'package-lock.json'
      - 'tools/cloud/setup-native.sh'
      - '.github/workflows/yuga-native.yml'
  pull_request:
    paths:
      - 'games/yuga-native/**'
      - 'games/yuga/shared/**'
      - 'games/yuga/server/**'
      - 'games/yuga/tests/projectile-lifetime.test.ts'
      - 'package-lock.json'
      - 'tools/cloud/setup-native.sh'
      - '.github/workflows/yuga-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yuga-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Install locked authority dependencies
        run: npm ci
      - name: Verify isolated offline reuse adapters
        run: |
          npm ci --prefix games/yuga-native/tools/reuse-art --ignore-scripts
          npm test --prefix games/yuga-native/tools/reuse-art
          python3 -m unittest discover -s games/yuga-native/tools/reuse-animation -p 'test_*.py' -v
      - name: Validate production dependency ledger and its counterexamples
        run: |
          python3 games/yuga-native/tools/check-roadmap.py --report "$RUNNER_TEMP/roadmap-check.json"
          python3 games/yuga-native/tests/roadmap_cases.py > "$RUNNER_TEMP/roadmap-cases.json"
          python3 games/yuga-native/tools/check-evidence.py --git-ref HEAD --report "$RUNNER_TEMP/evidence-check.json"
      - name: Check authoritative game rules and projectile boundaries
        run: |
          npm run yuga:typecheck
          npm run yuga:test
      - name: Install verified Godot 4.6.3
        env:
          GODOT_SHA256: d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3
        run: |
          curl --fail --location --retry 2 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          echo "$GODOT_SHA256  $RUNNER_TEMP/godot.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.6.3-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Validate original environment geometry and materials
        run: python3 games/yuga-native/art/validate_courtyard.py
      - name: Validate shared Confluence layout and packaged specification
        run: |
          python3 games/yuga-native/tools/stage-world.py --check
          python3 games/yuga-native/tests/world_map_cases.py --report "$RUNNER_TEMP/world-map-cases.json"
          python3 games/yuga-native/tests/world_plan_cases.py --report "$RUNNER_TEMP/world-plan-cases.json"
      - name: Validate production hero geometry, skin weights and animation data
        run: python3 games/yuga-native/art/production/validate_rama.py
      - name: Validate cinematic timing, resources and counterexamples
        run: |
          python3 games/yuga-native/tests/combat_script_cases.py --report "$RUNNER_TEMP/combat-script-cases.json"
          python3 -S games/yuga-native/tools/cinematics/build-duel-audio.py --check
          python3 -S games/yuga-native/tools/cinematics/build-duel-audio.py --check-fixtures
          python3 games/yuga-native/tools/cinematics/stage-duel-notice.py --check
      - name: Independently validate GLB format with pinned Khronos package
        run: |
          python3 games/yuga-native/tools/research/prepare-gltf-validator.py --destination "$RUNNER_TEMP/gltf-validator"
          node games/yuga-native/tools/research/check-gltf.mjs --validator-dir "$RUNNER_TEMP/gltf-validator" --report "$RUNNER_TEMP/gltf-validation.json" --asset games/yuga-native/assets/heroes/rama-production.glb --asset games/yuga-native/assets/heroes/rama-hero.glb --asset games/yuga-native/assets/heroes/rama-hero-mid.glb --asset games/yuga-native/assets/heroes/rama-hero-far.glb --asset games/yuga-native/assets/environment/lanka_courtyard.glb --asset games/yuga-native/assets/world/architecture.glb --asset games/yuga-native/assets/world/nature.glb --asset games/yuga-native/assets/cinematics/ravana-sentinel.glb
      - name: Check runtime UID closure before editor import
        run: python3 games/yuga-native/tests/package_runtime_uid_cases.py --report="$RUNNER_TEMP/package-runtime-uids.json"
      - name: Import native project
        run: Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --editor --import --quit
      - name: Audit actual animation library without runtime replacement
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reuse-animation"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --script res://tools/reuse-animation/export-library.gd -- --input="$GITHUB_WORKSPACE/games/yuga-native/assets/animations/rama_hero_motion.tres" --output="$RUNNER_TEMP/reuse-animation/library.json"
          python3 games/yuga-native/tools/reuse-animation/audit.py --input "$RUNNER_TEMP/reuse-animation/library.json" --output "$RUNNER_TEMP/reuse-animation/proposal"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --script res://tools/reuse-animation/verify-candidate.gd -- --input="$GITHUB_WORKSPACE/games/yuga-native/assets/animations/rama_hero_motion.tres" --candidate="$RUNNER_TEMP/reuse-animation/proposal/candidate.json" > "$RUNNER_TEMP/reuse-animation/godot-verify.log" 2>&1
          python3 -c 'import json,pathlib,sys; text=pathlib.Path(sys.argv[1]).read_text(); rows=[json.loads(line) for line in text.splitlines() if line.startswith("{")]; assert len(rows)==1 and rows[0]["passed"] and not rows[0]["runtime_asset_changed"]; assert "SCRIPT ERROR" not in text and "ERROR:" not in text; print("Actual Godot interpolation audit passed")' "$RUNNER_TEMP/reuse-animation/godot-verify.log"
      - name: Native physics and animation acceptance
        run: Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/native_acceptance.gd -- --report=${{ runner.temp }}/native-acceptance.json
      - name: Rama combat motion interface practice and provenance gates
        run: |
          set -euo pipefail
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/rama_ability_cases.gd -- --report="$RUNNER_TEMP/rama-ability.json"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/rama_motion_cases.gd -- --asset=res://assets/heroes/rama-hero.glb --report="$RUNNER_TEMP/rama-motion.json"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/rama_screen_cases.gd -- --report="$RUNNER_TEMP/rama-screen.json"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/rama_hero_integration_cases.gd -- --report="$RUNNER_TEMP/rama-integration.json"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/rama_practice_cases.gd -- --report="$RUNNER_TEMP/rama-practice.json"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/rama_hud_layout_cases.gd -- --report="$RUNNER_TEMP/rama-hud-layout.json"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/rama_hud_expiry_cases.gd -- --report="$RUNNER_TEMP/rama-hud-expiry.json"
          python3 games/yuga-native/tests/rama_package_cases.py --groom-review games/yuga-native --report="$RUNNER_TEMP/rama-package.json"
          python3 games/yuga-native/tests/graphics_package_cases.py --report="$RUNNER_TEMP/graphics-package.json"
          python3 games/yuga-native/tests/rama_crown_package_cases.py --report="$RUNNER_TEMP/rama-crown-package.json"
      - name: Mythic catalogue, editable hero, carry and version contracts
        run: |
          python3 games/yuga-native/tools/check-hero-codex.py --report="$RUNNER_TEMP/hero-codex.json"
          python3 games/yuga-native/tests/hero_codex_cases.py --report="$RUNNER_TEMP/hero-codex-cases.json"
          python3 games/yuga-native/tests/hero_reconstruction_cases.py --report="$RUNNER_TEMP/hero-reconstruction.json"
          python3 games/yuga-native/tools/check-native-contracts.py --report="$RUNNER_TEMP/native-contract-pins.json"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --script res://tests/native_contract_cases.gd -- --report="$RUNNER_TEMP/native-contracts.json"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/hero_pose_cases.gd -- --report="$RUNNER_TEMP/hero-pose.json"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --script res://tests/world_presentation_cases.gd -- --report="$RUNNER_TEMP/world-presentation.json"
      - name: Mythic entity physics invocation effects UI audio and integration gates
        run: |
          set -euo pipefail
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/entity_bridge_cases.gd -- --report="$RUNNER_TEMP/entity-bridge.json"
          python3 games/yuga-native/tools/physics/run.py --godot Godot_v4.6.3-stable_linux.x86_64 --output "$RUNNER_TEMP/physics-run"
          cp "$RUNNER_TEMP/physics-run/comparison.json" "$RUNNER_TEMP/physics.json"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/ultimate_cases.gd -- --report="$RUNNER_TEMP/ultimate.json"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/ultimate_effects_cases.gd -- --report="$RUNNER_TEMP/ultimate-effects.json"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/invocation_ui_cases.gd -- --report="$RUNNER_TEMP/invocation-ui.json"
          python3 games/yuga-native/tools/audio/build-invocation-audio.py --check --report="$RUNNER_TEMP/invocation-audio-build.json"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/invocation_audio_cases.gd -- --report="$RUNNER_TEMP/invocation-audio.json"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/mythic_integration_cases.gd -- --report="$RUNNER_TEMP/mythic-integration.json"
          python3 games/yuga-native/tests/release_mythic_cases.py --report="$RUNNER_TEMP/mythic-release-gates.json"
      - name: Combat film seek, pose, effect and scene lifecycle checks
        run: |
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/combat_film_cases.gd -- --report=${{ runner.temp }}/combat-film-cases.json
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --script res://tests/combat_film_audio_cases.gd -- --report=${{ runner.temp }}/combat-film-audio-cases.json
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --script res://tests/duel_effects_cases.gd -- --report=${{ runner.temp }}/duel-effects-cases.json
      - name: Combat film anatomical motion continuity
        run: Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --script res://tests/combat_motion_continuity.gd -- --report=${{ runner.temp }}/combat-motion-continuity.json
      - name: Confluence native traversal and rendering resource checks
        run: |
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/world_scene_cases.gd -- --report=${{ runner.temp }}/world-scene-cases.json
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --script res://tests/world_lighting_cases.gd -- --report=${{ runner.temp }}/world-lighting-cases.json
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/world_flow_cases.gd -- --report=${{ runner.temp }}/world-flow-cases.json
      - name: Validate original traversal audio and new play systems
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/traversal-tools"
          "$RUNNER_TEMP/traversal-tools/bin/python" -m pip install --disable-pip-version-check numpy==2.3.5 Pillow==12.3.0
          "$RUNNER_TEMP/traversal-tools/bin/python" games/yuga-native/tools/audio/build-traversal-audio.py --check
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/traversal_cases.gd -- --report="$RUNNER_TEMP/traversal.json"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/traversal_pose_cases.gd -- --report="$RUNNER_TEMP/traversal-pose.json"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/lane_army_cases.gd -- --report="$RUNNER_TEMP/army.json"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/input_binding_cases.gd -- --report="$RUNNER_TEMP/controls.json"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/traversal_audio_cases.gd -- --report="$RUNNER_TEMP/traversal-audio.json"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/traversal_army_stress.gd -- --report="$RUNNER_TEMP/stress.json"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/siege_army_cases.gd -- --report="$RUNNER_TEMP/siege-army.json"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/lane_vehicle_art_cases.gd -- --report="$RUNNER_TEMP/vehicle-art.json"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/siege_effects_cases.gd -- --report="$RUNNER_TEMP/siege-effects.json"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/siege_ui_cases.gd -- --report="$RUNNER_TEMP/siege-ui.json"
          python3 games/yuga-native/tests/release_siege_cases.py --report="$RUNNER_TEMP/siege-release-gates.json"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tests/siege_pose_cases.gd -- --report="$RUNNER_TEMP/siege-pose.json"
          python3 games/yuga-native/tools/audio/build-siege-audio.py --check --report="$RUNNER_TEMP/siege-audio.json"
          python3 games/yuga-native/tests/traversal_security_cases.py --report="$RUNNER_TEMP/security.json"
          python3 games/yuga-native/tests/release_traversal_cases.py --report="$RUNNER_TEMP/release-gates.json"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tools/test-relay-control.gd -- --report="$RUNNER_TEMP/relay-control.json"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tools/test-relay-art.gd -- --report="$RUNNER_TEMP/relay-art.json"
          Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --fixed-fps 60 --script res://tools/test-relay-integration.gd -- --report="$RUNNER_TEMP/relay-integration.json"
          python3 games/yuga-native/tests/release_triad_cases.py --report="$RUNNER_TEMP/triad-release-gates.json"
      - name: Rama quality components and offline integration (headless; visual acceptance separate)
        run: |
          "$RUNNER_TEMP/traversal-tools/bin/python" games/yuga-native/tools/run-quality-checks.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.3-stable_linux.x86_64" --python "$RUNNER_TEMP/traversal-tools/bin/python" --output "$RUNNER_TEMP/rama-quality"
      - name: Offline authoring and staged open-art contracts (visual acceptance separate)
        run: |
          "$RUNNER_TEMP/traversal-tools/bin/python" games/yuga-native/tests/authoring_runner_cases.py --report="$RUNNER_TEMP/authoring-runner-cases.json"
          "$RUNNER_TEMP/traversal-tools/bin/python" games/yuga-native/tests/visual_catalog_cases.py --report="$RUNNER_TEMP/visual-catalog-cases.json"
          "$RUNNER_TEMP/traversal-tools/bin/python" games/yuga-native/tools/run-authoring-checks.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.3-stable_linux.x86_64" --python "$RUNNER_TEMP/traversal-tools/bin/python" --cloth-resource --output "$RUNNER_TEMP/authoring-checks"
      - name: Visual campaign resource, motion and native identity contracts (art acceptance separate)
        run: |
          "$RUNNER_TEMP/traversal-tools/bin/python" games/yuga-native/tools/run-visual-checks.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.3-stable_linux.x86_64" --python "$RUNNER_TEMP/traversal-tools/bin/python" --output "$RUNNER_TEMP/visual-checks"
      - name: Native screen and recovery contracts (rendered acceptance separate)
        run: |
          "$RUNNER_TEMP/traversal-tools/bin/python" games/yuga-native/tools/run-visual-checks.py --catalog screens --engine "$RUNNER_TEMP/godot/Godot_v4.6.3-stable_linux.x86_64" --python "$RUNNER_TEMP/traversal-tools/bin/python" --output "$RUNNER_TEMP/screen-checks"
      - name: Projectile lifetime, range and occlusion regression
        run: Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --script res://tests/projectile_cases.gd -- --report=${{ runner.temp }}/projectile-cases.json
      - name: Experimental motion numerical gate (visual acceptance remains separate)
        run: Godot_v4.6.3-stable_linux.x86_64 --headless --path games/yuga-native --script res://tests/motion_retarget_cases.gd -- --report=${{ runner.temp }}/motion-cases.json
      - name: Native two-client transport, interpolation and failure controls
        run: python3 games/yuga-native/tools/check-native-arena.py --engine "$RUNNER_TEMP/godot/Godot_v4.6.3-stable_linux.x86_64" --output "$RUNNER_TEMP/native-arena"
      - name: Export and inspect Linux and Windows resource packs
        run: python3 games/yuga-native/tools/package-native.py --linux-engine "$RUNNER_TEMP/godot/Godot_v4.6.3-stable_linux.x86_64" --export-only
      - name: Archive exact test and export evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yuga-native-acceptance
          path: |
            ${{ runner.temp }}/reuse-animation/proposal/audit.json
            ${{ runner.temp }}/reuse-animation/godot-verify.log
            ${{ runner.temp }}/native-acceptance.json
            ${{ runner.temp }}/rama-ability.json
            ${{ runner.temp }}/rama-motion.json
            ${{ runner.temp }}/rama-screen.json
            ${{ runner.temp }}/rama-integration.json
            ${{ runner.temp }}/rama-practice.json
            ${{ runner.temp }}/rama-hud-layout.json
            ${{ runner.temp }}/rama-hud-expiry.json
            ${{ runner.temp }}/rama-package.json
            ${{ runner.temp }}/graphics-package.json
            ${{ runner.temp }}/rama-crown-package.json
            ${{ runner.temp }}/rama-quality/summary.json
            ${{ runner.temp }}/rama-quality/source-before.json
            ${{ runner.temp }}/rama-quality/source-after.json
            ${{ runner.temp }}/rama-quality/reports/
            ${{ runner.temp }}/rama-quality/logs/
            ${{ runner.temp }}/authoring-runner-cases.json
            ${{ runner.temp }}/authoring-checks/
            ${{ runner.temp }}/visual-checks/
            ${{ runner.temp }}/screen-checks/
            ${{ runner.temp }}/entity-bridge.json
            ${{ runner.temp }}/physics.json
            ${{ runner.temp }}/ultimate.json
            ${{ runner.temp }}/ultimate-effects.json
            ${{ runner.temp }}/invocation-ui.json
            ${{ runner.temp }}/invocation-audio-build.json
            ${{ runner.temp }}/invocation-audio.json
            ${{ runner.temp }}/mythic-integration.json
            ${{ runner.temp }}/mythic-release-gates.json
            ${{ runner.temp }}/physics-run/
            ${{ runner.temp }}/hero-codex.json
            ${{ runner.temp }}/hero-codex-cases.json
            ${{ runner.temp }}/hero-reconstruction.json
            ${{ runner.temp }}/native-contract-pins.json
            ${{ runner.temp }}/native-contracts.json
            ${{ runner.temp }}/hero-pose.json
            ${{ runner.temp }}/world-presentation.json
            ${{ runner.temp }}/traversal.json
            ${{ runner.temp }}/traversal-pose.json
            ${{ runner.temp }}/army.json
            ${{ runner.temp }}/controls.json
            ${{ runner.temp }}/traversal-audio.json
            ${{ runner.temp }}/stress.json
            ${{ runner.temp }}/siege-army.json
            ${{ runner.temp }}/vehicle-art.json
            ${{ runner.temp }}/siege-effects.json
            ${{ runner.temp }}/siege-audio.json
            ${{ runner.temp }}/siege-pose.json
            ${{ runner.temp }}/siege-ui.json
            ${{ runner.temp }}/siege-release-gates.json
            ${{ runner.temp }}/security.json
            ${{ runner.temp }}/release-gates.json
            ${{ runner.temp }}/relay-control.json
            ${{ runner.temp }}/relay-art.json
            ${{ runner.temp }}/relay-integration.json
            ${{ runner.temp }}/triad-release-gates.json
            ${{ runner.temp }}/projectile-cases.json
            ${{ runner.temp }}/motion-cases.json
            ${{ runner.temp }}/combat-script-cases.json
            ${{ runner.temp }}/combat-film-cases.json
            ${{ runner.temp }}/combat-film-audio-cases.json
            ${{ runner.temp }}/combat-motion-continuity.json
            ${{ runner.temp }}/duel-effects-cases.json
            ${{ runner.temp }}/roadmap-check.json
            ${{ runner.temp }}/roadmap-cases.json
            ${{ runner.temp }}/evidence-check.json
            ${{ runner.temp }}/gltf-validation.json
            ${{ runner.temp }}/world-map-cases.json
            ${{ runner.temp }}/world-plan-cases.json
            ${{ runner.temp }}/world-scene-cases.json
            ${{ runner.temp }}/world-lighting-cases.json
            ${{ runner.temp }}/world-flow-cases.json
            ${{ runner.temp }}/native-arena/integration-report.json
            games/yuga-native/build/native-export-manifest.json
            games/yuga-native/build/export-*.log
          if-no-files-found: warn
