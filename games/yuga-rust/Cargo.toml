[package]
name = "yuga-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parry2d = { version = "=0.17.6", default-features = false, features = ["dim2", "f32", "std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
gltf = { version = "=1.4.1", default-features = false, features = ["names", "utils"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
