<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 1680 1188" role="img" aria-labelledby="sheet-title sheet-desc" ><title id="sheet-title">Monsoon Exchange · Grade, water and movement</title><desc id="sheet-desc">Measured longitudinal cuts and clearance assumptions</desc><defs><pattern id="cover-hatch" patternUnits="userSpaceOnUse" width="8" height="8"><rect width="8" height="8" fill="#52665d"/><path d="M-2 2 L2 -2 M0 8L8 0M6 10L10 6" fill="none" stroke="#748779" stroke-width="1.2"/></pattern><pattern id="wet-hatch" patternUnits="userSpaceOnUse" width="10" height="8"><rect width="10" height="8" fill="#80b6bc"/><path d="M0 4Q2 2 5 4T10 4" fill="none" stroke="#3c808a" stroke-width="1.2"/></pattern><pattern id="substrate" patternUnits="userSpaceOnUse" width="9" height="9"><rect width="9" height="9" fill="#c6bca1"/><path d="M0 9L9 0" fill="none" stroke="#b1a787" stroke-width=".9"/></pattern></defs><rect x="0" y="0" width="1680" height="1188" fill="#f6f2e8" stroke="none" stroke-width="0" /><text x="55" y="40" font-family="Noto Sans,sans-serif" font-size="15" font-weight="700" fill="#1c6872" text-anchor="start" letter-spacing="1.6">YUGA   /   EMBER RITE     ·     DISTRICT SURVEY</text><text x="52" y="100" fill="#193331" font-family="Noto Serif,serif" font-size="49">Grade, water and movement</text><text x="1624" y="42" font-family="Noto Sans,sans-serif" font-size="17" font-weight="700" fill="#4b625b" text-anchor="end" >MONSOON EXCHANGE     /     4 OF 4</text><text x="1624" y="88" font-family="Noto Sans,sans-serif" font-size="17" font-weight="400" fill="#4b625b" text-anchor="end" >Measured longitudinal cuts and clearance assumptions</text><line x1="54" y1="123" x2="1626" y2="123" stroke="#193331" stroke-width="2" /><text x="66" y="183" font-family="Noto Sans,sans-serif" font-size="15" font-weight="700" fill="#1c6872" text-anchor="start" letter-spacing="1.6">01   /   COPPER ARCADE TO SUN COURT</text><text x="1061" y="183" font-family="Noto Sans,sans-serif" font-size="15" font-weight="400" fill="#4b625b" text-anchor="end" >Cut at X +40 m  ·  northward</text><line x1="136" y1="472.1" x2="1016" y2="472.1" stroke="#d6d7c9" stroke-width="0.75" /><text x="124" y="477.1" font-family="Noto Sans,sans-serif" font-size="14" font-weight="400" fill="#4b625b" text-anchor="end" >-2 m</text><line x1="136" y1="445.2" x2="1016" y2="445.2" stroke="#d6d7c9" stroke-width="0.75" /><line x1="136" y1="418.3" x2="1016" y2="418.3" stroke="#d6d7c9" stroke-width="1.65" /><text x="124" y="423.3" font-family="Noto Sans,sans-serif" font-size="14" font-weight="400" fill="#4b625b" text-anchor="end" >+0 m</text><line x1="136" y1="391.4" x2="1016" y2="391.4" stroke="#d6d7c9" stroke-width="0.75" /><line x1="136" y1="364.5" x2="1016" y2="364.5" stroke="#d6d7c9" stroke-width="0.75" /><text x="124" y="369.5" font-family="Noto Sans,sans-serif" font-size="14" font-weight="400" fill="#4b625b" text-anchor="end" >+2 m</text><line x1="136" y1="337.6" x2="1016" y2="337.6" stroke="#d6d7c9" stroke-width="0.75" /><line x1="136" y1="310.7" x2="1016" y2="310.7" stroke="#d6d7c9" stroke-width="0.75" /><text x="124" y="315.7" font-family="Noto Sans,sans-serif" font-size="14" font-weight="400" fill="#4b625b" text-anchor="end" >+4 m</text><line x1="136" y1="283.8" x2="1016" y2="283.8" stroke="#d6d7c9" stroke-width="0.75" /><line x1="136" y1="256.9" x2="1016" y2="256.9" stroke="#d6d7c9" stroke-width="0.75" /><text x="124" y="261.9" font-family="Noto Sans,sans-serif" font-size="14" font-weight="400" fill="#4b625b" text-anchor="end" >+6 m</text><line x1="136" y1="230" x2="1016" y2="230" stroke="#d6d7c9" stroke-width="0.75" /><polygon points="136,502 136,386.02 437.053,386.02 726.526,337.6 1016,337.6 1016,502" fill="url(#substrate)"/><polyline points="136,386.02 437.053,386.02 726.526,337.6 1016,337.6" stroke="#193331" stroke-width="3" fill="none" stroke-linejoin="round" /><line x1="205.474" y1="244" x2="205.474" y2="502" stroke="#d6d7c9" stroke-width="1" stroke-dasharray="4 4"/><text x="205.474" y="238" font-family="Noto Sans,sans-serif" font-size="15" font-weight="620" fill="#193331" text-anchor="middle" >Arcade</text><text x="205.474" y="526" font-family="Noto Sans,sans-serif" font-size="13.5" font-weight="400" fill="#4b625b" text-anchor="middle" >Y -11</text><line x1="437.053" y1="244" x2="437.053" y2="502" stroke="#d6d7c9" stroke-width="1" stroke-dasharray="4 4"/><text x="437.053" y="238" font-family="Noto Sans,sans-serif" font-size="15" font-weight="620" fill="#193331" text-anchor="middle" >Ramp toe</text><text x="437.053" y="526" font-family="Noto Sans,sans-serif" font-size="13.5" font-weight="400" fill="#4b625b" text-anchor="middle" >Y -1</text><line x1="726.526" y1="244" x2="726.526" y2="502" stroke="#d6d7c9" stroke-width="1" stroke-dasharray="4 4"/><text x="726.526" y="238" font-family="Noto Sans,sans-serif" font-size="15" font-weight="620" fill="#193331" text-anchor="middle" >Sun threshold</text><text x="726.526" y="526" font-family="Noto Sans,sans-serif" font-size="13.5" font-weight="400" fill="#4b625b" text-anchor="middle" >Y 11.5</text><line x1="946.526" y1="244" x2="946.526" y2="502" stroke="#d6d7c9" stroke-width="1" stroke-dasharray="4 4"/><text x="946.526" y="238" font-family="Noto Sans,sans-serif" font-size="15" font-weight="620" fill="#193331" text-anchor="middle" >Sun Court</text><text x="946.526" y="526" font-family="Noto Sans,sans-serif" font-size="13.5" font-weight="400" fill="#4b625b" text-anchor="middle" >Y 21</text><text x="66" y="603" font-family="Noto Sans,sans-serif" font-size="15" font-weight="700" fill="#1c6872" text-anchor="start" letter-spacing="1.6">02   /   WEAVERS’ GATE TO SLUICE WALK</text><text x="1061" y="603" font-family="Noto Sans,sans-serif" font-size="15" font-weight="400" fill="#4b625b" text-anchor="end" >Cut at Y −11 m  ·  westward</text><line x1="136" y1="892.1" x2="1016" y2="892.1" stroke="#d6d7c9" stroke-width="0.75" /><text x="124" y="897.1" font-family="Noto Sans,sans-serif" font-size="14" font-weight="400" fill="#4b625b" text-anchor="end" >-2 m</text><line x1="136" y1="865.2" x2="1016" y2="865.2" stroke="#d6d7c9" stroke-width="0.75" /><line x1="136" y1="838.3" x2="1016" y2="838.3" stroke="#d6d7c9" stroke-width="1.65" /><text x="124" y="843.3" font-family="Noto Sans,sans-serif" font-size="14" font-weight="400" fill="#4b625b" text-anchor="end" >+0 m</text><line x1="136" y1="811.4" x2="1016" y2="811.4" stroke="#d6d7c9" stroke-width="0.75" /><line x1="136" y1="784.5" x2="1016" y2="784.5" stroke="#d6d7c9" stroke-width="0.75" /><text x="124" y="789.5" font-family="Noto Sans,sans-serif" font-size="14" font-weight="400" fill="#4b625b" text-anchor="end" >+2 m</text><line x1="136" y1="757.6" x2="1016" y2="757.6" stroke="#d6d7c9" stroke-width="0.75" /><line x1="136" y1="730.7" x2="1016" y2="730.7" stroke="#d6d7c9" stroke-width="0.75" /><text x="124" y="735.7" font-family="Noto Sans,sans-serif" font-size="14" font-weight="400" fill="#4b625b" text-anchor="end" >+4 m</text><line x1="136" y1="703.8" x2="1016" y2="703.8" stroke="#d6d7c9" stroke-width="0.75" /><line x1="136" y1="676.9" x2="1016" y2="676.9" stroke="#d6d7c9" stroke-width="0.75" /><text x="124" y="681.9" font-family="Noto Sans,sans-serif" font-size="14" font-weight="400" fill="#4b625b" text-anchor="end" >+6 m</text><line x1="136" y1="650" x2="1016" y2="650" stroke="#d6d7c9" stroke-width="0.75" /><polygon points="136,922 136,822.16 482.667,822.16 722.667,875.96 1016,875.96 1016,922" fill="url(#substrate)"/><polyline points="136,822.16 482.667,822.16 722.667,875.96 1016,875.96" stroke="#193331" stroke-width="3" fill="none" stroke-linejoin="round" /><line x1="189.333" y1="664" x2="189.333" y2="922" stroke="#d6d7c9" stroke-width="1" stroke-dasharray="4 4"/><text x="189.333" y="658" font-family="Noto Sans,sans-serif" font-size="15" font-weight="620" fill="#193331" text-anchor="middle" >Weavers’ Gate</text><text x="189.333" y="946" font-family="Noto Sans,sans-serif" font-size="13.5" font-weight="400" fill="#4b625b" text-anchor="middle" >X 3</text><line x1="482.667" y1="664" x2="482.667" y2="922" stroke="#d6d7c9" stroke-width="1" stroke-dasharray="4 4"/><text x="482.667" y="658" font-family="Noto Sans,sans-serif" font-size="15" font-weight="620" fill="#193331" text-anchor="middle" >Spillway crest</text><text x="482.667" y="946" font-family="Noto Sans,sans-serif" font-size="13.5" font-weight="400" fill="#4b625b" text-anchor="middle" >X -8</text><line x1="722.667" y1="664" x2="722.667" y2="922" stroke="#d6d7c9" stroke-width="1" stroke-dasharray="4 4"/><text x="722.667" y="658" font-family="Noto Sans,sans-serif" font-size="15" font-weight="620" fill="#193331" text-anchor="middle" >Spillway toe</text><text x="722.667" y="946" font-family="Noto Sans,sans-serif" font-size="13.5" font-weight="400" fill="#4b625b" text-anchor="middle" >X -17</text><line x1="909.333" y1="664" x2="909.333" y2="922" stroke="#d6d7c9" stroke-width="1" stroke-dasharray="4 4"/><text x="909.333" y="658" font-family="Noto Sans,sans-serif" font-size="15" font-weight="620" fill="#193331" text-anchor="middle" >Runnel</text><text x="909.333" y="946" font-family="Noto Sans,sans-serif" font-size="13.5" font-weight="400" fill="#4b625b" text-anchor="middle" >X -24</text><rect x="374.667" y="750.875" width="56" height="71.285" fill="url(#cover-hatch)" stroke="#193331" stroke-width="1.5" /><rect x="861.333" y="872.732" width="69.333" height="3.228" fill="url(#wet-hatch)" stroke="#1c6872" stroke-width="1.5" /><line x1="1096" y1="150" x2="1096" y2="1087" stroke="#d6d7c9" stroke-width="2" /><text x="1126" y="182" font-family="Noto Sans,sans-serif" font-size="15" font-weight="700" fill="#1c6872" text-anchor="start" letter-spacing="1.6">SURFACE REGISTER</text><text x="1126" y="229" font-family="Noto Sans,sans-serif" font-size="30" font-weight="650" fill="#193331" text-anchor="start" >4.4 m of site relief</text><text x="1126" y="269" font-family="Noto Sans,sans-serif" font-size="16.8" font-weight="400" fill="#4b625b" text-anchor="start" >Sun Court stands at +3.0 m. The cistern floor</text><text x="1126" y="295" font-family="Noto Sans,sans-serif" font-size="16.8" font-weight="400" fill="#4b625b" text-anchor="start" >sits at -1.4 m. Both use the same survey datum.</text><text x="1126" y="385" font-family="Noto Sans,sans-serif" font-size="23" font-weight="650" fill="#193331" text-anchor="start" >Steepest grade</text><text x="1126" y="422" font-family="Noto Sans,sans-serif" font-size="16.8" font-weight="400" fill="#4b625b" text-anchor="start" >Ledger Climb rises after a flat elbow. The</text><text x="1126" y="448" font-family="Noto Sans,sans-serif" font-size="16.8" font-weight="400" fill="#4b625b" text-anchor="start" >steepest panel has a 27.69% grade, or</text><text x="1126" y="474" font-family="Noto Sans,sans-serif" font-size="16.8" font-weight="400" fill="#4b625b" text-anchor="start" >15.5° above horizontal.</text><text x="1126" y="534" font-family="Noto Sans,sans-serif" font-size="23" font-weight="650" fill="#193331" text-anchor="start" >Choosing water</text><text x="1126" y="571" font-family="Noto Sans,sans-serif" font-size="16.8" font-weight="400" fill="#4b625b" text-anchor="start" >The 2.6 m-wide dye runnel carries 0.12 m</text><text x="1126" y="597" font-family="Noto Sans,sans-serif" font-size="16.8" font-weight="400" fill="#4b625b" text-anchor="start" >of water. Walk 12 m straight in it in 2.82 s,</text><text x="1126" y="623" font-family="Noto Sans,sans-serif" font-size="16.8" font-weight="400" fill="#4b625b" text-anchor="start" >or take either dry side in 2.40 s at 5 m/s.</text><text x="1126" y="685" font-family="Noto Sans,sans-serif" font-size="23" font-weight="650" fill="#193331" text-anchor="start" >Rotation reserve</text><text x="1126" y="722" font-family="Noto Sans,sans-serif" font-size="16.8" font-weight="400" fill="#4b625b" text-anchor="start" >B to A through Archive Court measures</text><text x="1126" y="748" font-family="Noto Sans,sans-serif" font-size="16.8" font-weight="400" fill="#4b625b" text-anchor="start" >119.32 m / 23.86 s on the sampled floor.</text><text x="1126" y="774" font-family="Noto Sans,sans-serif" font-size="16.8" font-weight="400" fill="#4b625b" text-anchor="start" >Via the middle switch it takes 25.36 s.</text><text x="1126" y="800" font-family="Noto Sans,sans-serif" font-size="16.8" font-weight="400" fill="#4b625b" text-anchor="start" >The 40 s burn and 3.5 s quench leave</text><text x="1126" y="826" font-family="Noto Sans,sans-serif" font-size="16.8" font-weight="400" fill="#4b625b" text-anchor="start" >12.64 s or 11.14 s for other actions.</text><line x1="1126" y1="872" x2="1621" y2="872" stroke="#d6d7c9" stroke-width="1" /><text x="1126" y="911" font-family="Noto Sans,sans-serif" font-size="16.8" font-weight="400" fill="#4b625b" text-anchor="start" >Route times follow a 0.5 m grid with a</text><text x="1126" y="937" font-family="Noto Sans,sans-serif" font-size="16.8" font-weight="400" fill="#4b625b" text-anchor="start" >0.65 m radius. Positions are measured to</text><text x="1126" y="963" font-family="Noto Sans,sans-serif" font-size="16.8" font-weight="400" fill="#4b625b" text-anchor="start" >site centres. Combat and acceleration</text><text x="1126" y="989" font-family="Noto Sans,sans-serif" font-size="16.8" font-weight="400" fill="#4b625b" text-anchor="start" >need playtesting.</text><text x="66" y="1023" font-family="Noto Sans,sans-serif" font-size="16.4" font-weight="400" fill="#4b625b" text-anchor="start" >Cuts sample the actual floor patches at the specified coordinate. The vertical axis is exaggerated for legibility.</text><text x="66" y="1048" font-family="Noto Sans,sans-serif" font-size="16.4" font-weight="400" fill="#4b625b" text-anchor="start" >Arrows on the plan point uphill. A flat landing occupies each right-angle turn.</text><line x1="54" y1="1119" x2="1626" y2="1119" stroke="#193331" stroke-width="1.3" /><text x="55" y="1155" font-family="Noto Sans,sans-serif" font-size="15" font-weight="700" fill="#4b625b" text-anchor="start" letter-spacing="1.6">MONSOON EXCHANGE   /   MEASURED GAME ARCHITECTURE</text><text x="1626" y="1155" font-family="Noto Sans,sans-serif" font-size="16" font-weight="500" fill="#4b625b" text-anchor="end" >A3 at 100%     ·     metre survey     ·     4 / 4</text></svg>
