[package]
name = "yuga-map-finish"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1"
binrw = "0.15"
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tempfile = "3"
vbsp = "=0.9.2"
zip = { version = "=0.6.6", default-features = false }

[profile.release]
strip = "debuginfo"
