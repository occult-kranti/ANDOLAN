<script type="application/ld+json">[{"@context":"http:\/\/schema.org","@type":"QAPage","publisher":{"@type":"Organization","name":"PS4Linux Forums | PS4 Linux Distros, Windows Gaming, and more","url":"https:\/\/ps4linux.com\/forums","description":"A place to discuss PS4 Linux distros, gaming, Wine, Lutris, AI\/ML and generally anything about running Linux on PS4","logo":"https:\/\/ps4linux.com\/forums\/assets\/logo-q5iihlen.png"},"image":"https:\/\/ps4linux.com\/forums\/assets\/site-image-i7cmgrqd.png","headline":"A.I. on ps4linux","datePublished":"2023-07-05T16:50:36+00:00","description":"So a.i. seems to be the new buzz word around the tech world and non-tech world alike. I'm sure most of us have at least heard about ChatGPT. There have also...","dateModified":"2023-07-05T20:06:51+00:00","url":"https:\/\/ps4linux.com\/forums\/d\/130-ai-on-ps4linux","mainEntity":{"@type":"Question","name":"A.I. on ps4linux","text":"\u003Cp\u003ESo a.i. seems to be the new buzz word around the tech world and non-tech world alike. I'm sure most of us have at least heard about ChatGPT. There have also been a number of open source alternatives released thanks to the leak of llama source from Meta. After playing around with ChatGPT for a few hours, I  became curious if these things (llm or large language models) could be run locally on a home pc. I don't like the idea of feeding my data to for-profit companies.\u003C\/p\u003E\n\n\u003Cp\u003EThe short answer is: Yes these things can be run locally. The open source alternatives that have come about since the llama leak are numerous and growing every day!\u003C\/p\u003E \n\n\u003Cp\u003EUnfortunately, it seems for the majority of them someone would need a mid range gaming pc at minimum.\u003C\/p\u003E\n\n\u003Cp\u003EI wasn't (and am still not) sure what PC equivalent would\/could best be compared to ps4linux in terms of performance and capabilties. But I thought if I can play gta online on ps4linux surely I can get some kind of open source llm to run on ps4linux. I had already accepted that if I got anything like this to run on ps4linux it would very likely be pretty sub-par. So after some googling I was cloning gits left and right and following install instructions I barely understand lol. Admittedly what I know about ai, llm, etc. could be compared to what I knew about running linux on ps4 a year ago when I first started. I know its possible but don't know any of the inner workings yet.\u003C\/p\u003E\n\n\u003Cp\u003EEnough of the preamble tho, lets get down to it. Almost all my attempts to run any kind of ai, llm etc. on ps4linux have not been fruitful. I'm sure it is possible, I just lack the know how at the moment. Notice I said \"almost all\", yes friends thats right I have succeeded in getting one of these new fangled ai thingies running on ps4linux.\u003C\/p\u003E\n\n\u003Cp\u003EIf you havent heard about stable diffusion it's a text to image generator. You type a description and it outputs an image based on your text. It does indeed run on ps4linux. Now I won't pretend that it runs well, but it does run and generate an image.\u003C\/p\u003E\n\n\u003Cp\u003E\u003Ca href=\"https:\/\/github.com\/easydiffusion\/easydiffusion\" rel=\"ugc noopener nofollow\" target=\"_blank\" rel=\"ugc noopener nofollow\" target=\"_blank\"\u003EHere\u003C\/a\u003E is the link that I followed to install. But before you rush there to learn how to install\/run this for yourself, I should warn you all my attempts to install directly on ps4linux resulted in timeout errors and drive space (even tho I know the drive has enough free space) errors.\u003C\/p\u003E\n\n \u003Cp\u003EI posted the link primarily to be a guide on what to do once it is installed. In the end I used the linux side of my highly outdated dual-boot desktop pc (intel core 2 duo with no gpu lol) to install. Once it was successfully installed on desktop (no errors) it tried to run on desktop but it more or less just locked up the pc, which was more than expected on a potatoe posing as a pc lol.\u003C\/p\u003E \n \n\u003Cp\u003EMy next step was to copy the file folder from potatoe to ps4linux, on first attempt I copied it to my main (daily driver\/gaming) install, the same install I'm typing this on now. The result was less than I had hoped as it still would not run. After that I thought that maybe my prior attempts at various other ai installations was the problem.\u003C\/p\u003E\n\n \u003Cp\u003EI noticed when I tried running some of those prior installations that it was trying to install oudated versions of required libraries and such. So my next thought was to try it on a fresh install. I did a fresh install and attempted to install directly on ps4linux using the above link, and much to my dismay it returned the same timeout, drive space errors. I then copied the file folder from the desktop to the fresh install and it flipping ran.\u003C\/p\u003E\n\n  \u003Cp\u003EI have uploaded the file folder \u003Ca href=\"https:\/\/mega.nz\/file\/bM8xBSbS#8xCj6X6zvr-6sKSKIVj5GEgflBlQhcskwIpa9rp8NJQ\" rel=\"ugc noopener nofollow\" target=\"_blank\" rel=\"ugc noopener nofollow\" target=\"_blank\"\u003Ehere\u003C\/a\u003E for anyone else who wants to attempt this. This does run on ps4linux but not as well as I initially hoped, but it does run.  It took around 2-3 hours to output an image from my text input. It also used the 4gb of ram and 6gb of my 8gb swap. I only did the one test and didnt mess with any settings whatsoever.  After about a week of trial and error (git cloning,following install instructions, etc.) with something I barely understand I'm counting this as a win.\u003C\/p\u003E \n\n\u003Cp\u003EThis got a lot more long winded than I had Intended, I just tried to include as much info as I could think of.\u003C\/p\u003E","dateCreated":"2023-07-05T16:50:36+00:00","author":{"@type":"Person","name":"misfit-mischief"},"answerCount":14,"suggestedAnswer":[{"@type":"Answer","text":"\u003Cp\u003EI did some ai powered wardriving (WiFi Hacking) with pwnagotchi in past. \u003Cbr\u003E\n\u003Ca href=\"https:\/\/pwnagotchi.ai\/\" rel=\"ugc noopener nofollow\" target=\"_blank\" rel=\"ugc noopener nofollow\" target=\"_blank\"\u003Ehttps:\/\/pwnagotchi.ai\/\u003C\/a\u003E\u003Cbr\u003E\nIntersting but very complex stuff. But train an ai with ps4 GPU power sounds good.\u003C\/p\u003E","dateCreated":"2023-07-05T17:36:41+00:00","url":"https:\/\/ps4linux.com\/forums\/d\/130-ai-on-ps4linux\/2","author":{"@type":"Person","name":"tastebin"},"upvoteCount":0},{"@type":"Answer","text":"\u003Cp\u003E\u003Ca href=\"https:\/\/ps4linux.com\/forums\/d\/130\/2\" class=\"PostMention\" data-id=\"1103\" rel=\"\" target=\"\"\u003Etastebin\u003C\/a\u003E I agree that does sound good. Training an ai running linux on ps4 hardware was my initial goal but I quickly figured out I had a vast amount of learning to do to get there.\u003C\/p\u003E \n\n\u003Cp\u003EI also need to change the link to the \"pre-installed\" folder, I had a brain fart and uploaded the folder instead of the tar.xz, once it is uploaded I will change the link to point to the tar.xz\u003C\/p\u003E\n\n\u003Cp\u003EThe link now points to the tar.xz\u003C\/p\u003E","dateCreated":"2023-07-05T18:19:24+00:00","url":"https:\/\/ps4linux.com\/forums\/d\/130-ai-on-ps4linux\/3","author":{"@type":"Person","name":"misfit-mischief"},"upvoteCount":1},{"@type":"Answer","text":"\u003Cp\u003E\u003Ca href=\"https:\/\/ps4linux.com\/forums\/d\/130\/3\" class=\"PostMention\" data-id=\"1105\" rel=\"\" target=\"\"\u003Emisfit-mischief\u003C\/a\u003E this \"A.I.\" is for generating images did you find any that are the same as chatgpt but open source that works on ps4 linux?\u003C\/p\u003E","dateCreated":"2023-07-08T12:23:04+00:00","url":"https:\/\/ps4linux.com\/forums\/d\/130-ai-on-ps4linux\/4","author":{"@type":"Person","name":"kevinF"},"upvoteCount":0},{"@type":"Answer","text":"\u003Cp\u003E\u003Ca href=\"https:\/\/ps4linux.com\/forums\/d\/130\/4\" class=\"PostMention\" data-id=\"1113\" rel=\"\" target=\"\"\u003EkevinF\u003C\/a\u003E I have tried a few but I havent yet had any success. It should definitely be possible tho as they have versions that run only on a cpu.\u003C\/p\u003E\n\n\n\u003Cp\u003EUpdate:  gpt4all runs on ps4linux, I downloaded a 7b model that uses 8gb ram and it ran , again it runs pretty slow.\u003Cbr\u003E\n\u003Ca href=\"https:\/\/i.imgur.com\/pHaqeSL.jpg\" rel=\"ugc noopener nofollow\" target=\"_blank\" rel=\"ugc noopener nofollow\" target=\"_blank\"\u003E\u003Cimg src=\"https:\/\/i.imgur.com\/pHaqeSLh.jpg\" title=\"\" alt=\"\"\u003E\u003C\/a\u003E\u003C\/p\u003E\n\n\u003Cp\u003E\u003Ca href=\"https:\/\/mega.nz\/file\/OIlzyLqK#jRb5bgAkFon7HjiQb_mJxVt0FHvfWt5eMrgmsyQko8U\" rel=\"ugc noopener nofollow\" target=\"_blank\" rel=\"ugc noopener nofollow\" target=\"_blank\"\u003EGPT4All-Installer\u003C\/a\u003E Once installed a gpt4all folder will be in the home folder. Inside is a maintenance tool that should be run. Once complete open the bin folder and run chat.\u003Cbr\u003E\nIt should prompt a model download.  The gui is pretty simple to figure out.\u003C\/p\u003E \n\n\u003Cp\u003EFor anyone interested, I've been testing different models and settings. So far \u003Ca href=\"https:\/\/huggingface.co\/TheBloke\/orca_mini_3B-GGML\/tree\/main\" rel=\"ugc noopener nofollow\" target=\"_blank\" rel=\"ugc noopener nofollow\" target=\"_blank\"\u003Ethe q8 version\u003C\/a\u003E of this model has the fastest response.\u003C\/p\u003E\n\n\u003Cp\u003EAs for settings I've set cpu threads to 6. Response generation is much quicker than any other I've tested\u003Cbr\u003E\n\u003Ca href=\"https:\/\/i.imgur.com\/YUmEKZi.png\" rel=\"ugc noopener nofollow\" target=\"_blank\" rel=\"ugc noopener nofollow\" target=\"_blank\"\u003E\u003Cimg src=\"https:\/\/i.imgur.com\/YUmEKZih.png\" title=\"\" alt=\"\"\u003E\u003C\/a\u003E\u003Cbr\u003E\nEach cpu thread ups the cpu usage when generating a response. 6 cpu threads uses between 75% -85% of cpu according to conky.\u003C\/p\u003E\n\n","dateCreated":"2023-07-08T12:37:49+00:00","url":"https:\/\/ps4linux.com\/forums\/d\/130-ai-on-ps4linux\/5","author":{"@type":"Person","name":"misfit-mischief"},"upvoteCount":0},{"@type":"Answer","text":"\u003Cp\u003EUpdate: for those that want to run a local stable diffusion (text to image generator) setup, I highly recommend fastsd_cpu.\u003C\/p\u003E\n\n\u003Cp\u003EThere are some requirements, but chances are you already have them installed.\u003C\/p\u003E\n\u003Col style=\"list-style-type:decimal\"\u003E\u003Cli\u003Egit installed \u003C\/li\u003E\n\u003Cli\u003Epip installed\u003C\/li\u003E\n\u003Cli\u003Eqt5-qtbase-gui\u003C\/li\u003E\u003C\/ol\u003E\n\n\n\u003Cp\u003EUse git clone to get the repo here   \u003Ca href=\"https:\/\/github.com\/rupeshs\/fastsdcpu\" rel=\"ugc noopener nofollow\" target=\"_blank\" rel=\"ugc noopener nofollow\" target=\"_blank\"\u003Ehttps:\/\/github.com\/rupeshs\/fastsdcpu\u003C\/a\u003E\u003C\/p\u003E\n\n\u003Cp\u003EOpen a terminal in the fastsdcpu folder you just cloned\u003C\/p\u003E\n\n\u003Cp\u003EType \u003Ccode\u003Epip install -r requirements.txt\u003C\/code\u003E this part takes a little while\u003C\/p\u003E\n\n\u003Cp\u003EOnce thats done go to fastsdcpu folder and right click install.sh, click permissions and make sure its executable. Then double click and a small window should pop up giving a choice to execute\/execute in terminal, choose \"in terminal\", this part also take a little while\u003C\/p\u003E\n\n\u003Cp\u003EOnce thats done you can double click start.sh, again it will give the same options as before again choose \"in terminal\"\u003C\/p\u003E\n\n\u003Cp\u003ESoon after a gui should pop up. If not and the terminal shows an error, it is most likely a qt issue ( figuring out the fix) in this case try using the start-webui.sh\u003C\/p\u003E\n\n\u003Cp\u003EIf a browser doesnt auto open with the web ui you can open a browser and plug in the ip shown in terminal\u003C\/p\u003E \n\n\u003Cp\u003EOn the first run its going to take awhile since it first has to download the chosen model.\u003Cbr\u003E\nI recommend the lcm-lora option its default lykon\/dreamshaperv8 is pretty decent\u003C\/p\u003E\n \n\u003Cp\u003EIve been using this for awhile and it works pretty well for what is  and what it is running on.\u003Cbr\u003E\nFor best results use the 1gb payload when booting linux, we want the most ram possible, also I would recommend an 8gb swap.\u003C\/p\u003E\n\n\u003Cp\u003EOn 1gb payload a 512x512 image takes just under 20 seconds per step and I use a bare minimum of 4 steps per image\u003Cbr\u003E\nHere is a few Ive generated on ps4linux using fastsdcpu \u003Cbr\u003E\n\u003Ca href=\"https:\/\/i.imgur.com\/TNQTAPU.png\" rel=\"ugc noopener nofollow\" target=\"_blank\" rel=\"ugc noopener nofollow\" target=\"_blank\"\u003E\u003Cimg src=\"https:\/\/i.imgur.com\/TNQTAPU.png\" title=\"\" alt=\"\"\u003E\u003C\/a\u003E\u003Cbr\u003E\n\u003Ca href=\"https:\/\/i.imgur.com\/DzsknNl.png\" rel=\"ugc noopener nofollow\" target=\"_blank\" rel=\"ugc noopener nofollow\" target=\"_blank\"\u003E\u003Cimg src=\"https:\/\/i.imgur.com\/DzsknNl.png\" title=\"\" alt=\"\"\u003E\u003C\/a\u003E\u003Cbr\u003E\n\u003Ca href=\"https:\/\/i.imgur.com\/BBBJ3Kq.png\" rel=\"ugc noopener nofollow\" target=\"_blank\" rel=\"ugc noopener nofollow\" target=\"_blank\"\u003E\u003Cimg src=\"https:\/\/i.imgur.com\/BBBJ3Kq.png\" title=\"\" alt=\"\"\u003E\u003C\/a\u003E\u003C\/p\u003E\n\n\u003Cp\u003EIf you have any questions, or any issues let me know and ill do my best to help.\u003C\/p\u003E\n","dateCreated":"2024-01-31T19:51:17+00:00","url":"https:\/\/ps4linux.com\/forums\/d\/130-ai-on-ps4linux\/6","author":{"@type":"Person","name":"misfit-mischief"},"upvoteCount":1},{"@type":"Answer","text":"\u003Cp\u003EThis is cool.\u003C\/p\u003E","dateCreated":"2024-02-02T13:27:36+00:00","url":"https:\/\/ps4linux.com\/forums\/d\/130-ai-on-ps4linux\/7","author":{"@type":"Person","name":"noob404"},"upvoteCount":0},{"@type":"Answer","text":"\u003Cp\u003EWhat distro do you use? What is fastdcpu?\u003C\/p\u003E","dateCreated":"2024-02-05T14:59:35+00:00","url":"https:\/\/ps4linux.com\/forums\/d\/130-ai-on-ps4linux\/8","author":{"@type":"Person","name":"Naxil"},"upvoteCount":0},{"@type":"Answer","text":"\u003Cp\u003E\u003Ca href=\"https:\/\/ps4linux.com\/forums\/d\/130\/8\" class=\"PostMention\" data-id=\"1640\" rel=\"\" target=\"\"\u003ENaxil\u003C\/a\u003E Program to enable faster AI-related work on CPU.\u003C\/p\u003E","dateCreated":"2024-02-06T06:41:20+00:00","url":"https:\/\/ps4linux.com\/forums\/d\/130-ai-on-ps4linux\/9","author":{"@type":"Person","name":"noob404"},"upvoteCount":0},{"@type":"Answer","text":"\u003Cp\u003E\u003Ca href=\"https:\/\/ps4linux.com\/forums\/d\/130\/9\" class=\"PostMention\" data-id=\"1642\" rel=\"\" target=\"\"\u003Enoob404\u003C\/a\u003E is possible know how ps4 distro.works? Because some part isnt regular like normal distro (kernel and other part). Proc folder dont exist ecc ecc (lsmod not works at all).\u003Cbr\u003E\nAnd probably some people had make the distro without know in deep what do (on fedora38 i have find a strange subdirectory with 6.* kernel files)\u003Cbr\u003E\nDistro makers lot of time say = update mesa,kernel,distro when mesa without pc never works and kernel cant be updated at all.\u003Cbr\u003E\nAnd i want know how payload works. Why not load a tool for launch linux like grub,lilo or other?\u003C\/p\u003E","dateCreated":"2024-02-06T06:55:42+00:00","url":"https:\/\/ps4linux.com\/forums\/d\/130-ai-on-ps4linux\/10","author":{"@type":"Person","name":"Naxil"},"upvoteCount":0},{"@type":"Answer","text":"\u003Cp\u003E\u003Ca href=\"https:\/\/ps4linux.com\/forums\/d\/130\/10\" class=\"PostMention\" data-id=\"1643\" rel=\"\" target=\"\"\u003ENaxil\u003C\/a\u003E Truth be said, I don't claim to know 100% of what happens under the hood. But, here's my preliminary understanding.\u003Cbr\u003E\nPS4 uses kexec bootloader which lets you switch kernel and initram without an actual reboot (you might have noticed that the PS4 doesn't actually shut down before booting into Linux). So, kexec is being used to switch from the FreeBSD kernel of Orbis to the other Linux kernel. With that being the basic way to boot into Linux for the time being, Grub will just be an additional unnecessary step. Instead of that though, if you are just looking to multi-boot, I already have the multi-boot initram.\u003C\/p\u003E\n\n\u003Cp\u003ECorrect me if I am wrong.\u003C\/p\u003E\n\n\u003Cp\u003EDon't understand the rest of your questions.\u003C\/p\u003E","dateCreated":"2024-02-07T15:48:51+00:00","url":"https:\/\/ps4linux.com\/forums\/d\/130-ai-on-ps4linux\/11","author":{"@type":"Person","name":"noob404"},"upvoteCount":0},{"@type":"Answer","text":"\u003Cp\u003EOk you are right. But after that some module functionality cant be used. Or probably iam not able to do it. Because my wifi\/bt sometimes work sometimes not (you know i have torus2 i give to you my sys file on discord), i want find a way to reload\/restart the wifi\/bt module. Or what we can do for have good bzimage\/initramfs.cpio.gz for torus2?\u003C\/p\u003E","dateCreated":"2024-02-07T16:45:29+00:00","url":"https:\/\/ps4linux.com\/forums\/d\/130-ai-on-ps4linux\/12","author":{"@type":"Person","name":"Naxil"},"upvoteCount":0},{"@type":"Answer","text":"\u003Cp\u003E\u003Ca href=\"https:\/\/ps4linux.com\/forums\/d\/130\/12\" class=\"PostMention\" data-id=\"1648\" rel=\"\" target=\"\"\u003ENaxil\u003C\/a\u003E PS4 Linux currently runs off of a monolithic kernel, that is everything is built into the kernel as drivers, not modules. As for the WiFi issue itself, Torus 2 has been a buggy chipset, working of which is mostly very arbitrary. This will need a much closer look and a lot of time and expertise.\u003C\/p\u003E","dateCreated":"2024-02-08T13:43:02+00:00","url":"https:\/\/ps4linux.com\/forums\/d\/130-ai-on-ps4linux\/13","author":{"@type":"Person","name":"noob404"},"upvoteCount":0},{"@type":"Answer","text":"\u003Cp\u003E\u003Ca href=\"https:\/\/ps4linux.com\/forums\/u\/misfit-mischief\" class=\"UserMention\" rel=\"\" target=\"\"\u003E@misfit-mischief\u003C\/a\u003E Mind if I write an article on this, with noob-friendly instructions maybe. And obviously, you will be credited.\u003C\/p\u003E","dateCreated":"2024-02-09T05:28:44+00:00","url":"https:\/\/ps4linux.com\/forums\/d\/130-ai-on-ps4linux\/14","author":{"@type":"Person","name":"noob404"},"upvoteCount":0},{"@type":"Answer","text":"\u003Cp\u003E\u003Ca href=\"https:\/\/ps4linux.com\/forums\/d\/130\/14\" class=\"PostMention\" data-id=\"1650\" rel=\"\" target=\"\"\u003Enoob404\u003C\/a\u003E Yea man, go for it. Dont worry about giving me credit, All im here for is the sharing of knowedge.\u003C\/p\u003E","dateCreated":"2024-02-15T02:10:09+00:00","url":"https:\/\/ps4linux.com\/forums\/d\/130-ai-on-ps4linux\/15","author":{"@type":"Person","name":"misfit-mischief"},"upvoteCount":1}]}},{"@context":"http:\/\/schema.org","@type":"BreadcrumbList","itemListElement":{"@type":"ListItem","name":"General","item":"https:\/\/ps4linux.com\/forums\/t\/general","position":1}},{"@context":"http:\/\/schema.org","@type":"WebSite","url":"https:\/\/ps4linux.com\/forums\/","potentialAction":{"@type":"SearchAction","target":"https:\/\/ps4linux.com\/forums\/?q={search_term_string}","query-input":"required name=search_term_string"}}]</script>

    <h2>A.I. on ps4linux</h2>

    <div>
                    <div>
                                <h3>misfit-mischief</h3>
                <div class="Post-body">
                    <p>So a.i. seems to be the new buzz word around the tech world and non-tech world alike. I'm sure most of us have at least heard about ChatGPT. There have also been a number of open source alternatives released thanks to the leak of llama source from Meta. After playing around with ChatGPT for a few hours, I  became curious if these things (llm or large language models) could be run locally on a home pc. I don't like the idea of feeding my data to for-profit companies.</p>

<p>The short answer is: Yes these things can be run locally. The open source alternatives that have come about since the llama leak are numerous and growing every day!</p> 

<p>Unfortunately, it seems for the majority of them someone would need a mid range gaming pc at minimum.</p>

<p>I wasn't (and am still not) sure what PC equivalent would/could best be compared to ps4linux in terms of performance and capabilties. But I thought if I can play gta online on ps4linux surely I can get some kind of open source llm to run on ps4linux. I had already accepted that if I got anything like this to run on ps4linux it would very likely be pretty sub-par. So after some googling I was cloning gits left and right and following install instructions I barely understand lol. Admittedly what I know about ai, llm, etc. could be compared to what I knew about running linux on ps4 a year ago when I first started. I know its possible but don't know any of the inner workings yet.</p>

<p>Enough of the preamble tho, lets get down to it. Almost all my attempts to run any kind of ai, llm etc. on ps4linux have not been fruitful. I'm sure it is possible, I just lack the know how at the moment. Notice I said "almost all", yes friends thats right I have succeeded in getting one of these new fangled ai thingies running on ps4linux.</p>

<p>If you havent heard about stable diffusion it's a text to image generator. You type a description and it outputs an image based on your text. It does indeed run on ps4linux. Now I won't pretend that it runs well, but it does run and generate an image.</p>

<p><a href="https://github.com/easydiffusion/easydiffusion" rel="ugc noopener nofollow" target="_blank" rel="ugc noopener nofollow" target="_blank">Here</a> is the link that I followed to install. But before you rush there to learn how to install/run this for yourself, I should warn you all my attempts to install directly on ps4linux resulted in timeout errors and drive space (even tho I know the drive has enough free space) errors.</p>

 <p>I posted the link primarily to be a guide on what to do once it is installed. In the end I used the linux side of my highly outdated dual-boot desktop pc (intel core 2 duo with no gpu lol) to install. Once it was successfully installed on desktop (no errors) it tried to run on desktop but it more or less just locked up the pc, which was more than expected on a potatoe posing as a pc lol.</p> 
 
<p>My next step was to copy the file folder from potatoe to ps4linux, on first attempt I copied it to my main (daily driver/gaming) install, the same install I'm typing this on now. The result was less than I had hoped as it still would not run. After that I thought that maybe my prior attempts at various other ai installations was the problem.</p>

 <p>I noticed when I tried running some of those prior installations that it was trying to install oudated versions of required libraries and such. So my next thought was to try it on a fresh install. I did a fresh install and attempted to install directly on ps4linux using the above link, and much to my dismay it returned the same timeout, drive space errors. I then copied the file folder from the desktop to the fresh install and it flipping ran.</p>

  <p>I have uploaded the file folder <a href="https://mega.nz/file/bM8xBSbS#8xCj6X6zvr-6sKSKIVj5GEgflBlQhcskwIpa9rp8NJQ" rel="ugc noopener nofollow" target="_blank" rel="ugc noopener nofollow" target="_blank">here</a> for anyone else who wants to attempt this. This does run on ps4linux but not as well as I initially hoped, but it does run.  It took around 2-3 hours to output an image from my text input. It also used the 4gb of ram and 6gb of my 8gb swap. I only did the one test and didnt mess with any settings whatsoever.  After about a week of trial and error (git cloning,following install instructions, etc.) with something I barely understand I'm counting this as a win.</p> 

<p>This got a lot more long winded than I had Intended, I just tried to include as much info as I could think of.</p>
                </div>
            </div>

            <hr>
                    <div>
                                <h3>tastebin</h3>
                <div class="Post-body">
                    <p>I did some ai powered wardriving (WiFi Hacking) with pwnagotchi in past. <br>
<a href="https://pwnagotchi.ai/" rel="ugc noopener nofollow" target="_blank" rel="ugc noopener nofollow" target="_blank">https://pwnagotchi.ai/</a><br>
Intersting but very complex stuff. But train an ai with ps4 GPU power sounds good.</p>
                </div>
            </div>

            <hr>
                    <div>
                                <h3>misfit-mischief</h3>
                <div class="Post-body">
                    <p><a href="https://ps4linux.com/forums/d/130/2" class="PostMention" data-id="1103" rel="" target="">tastebin</a> I agree that does sound good. Training an ai running linux on ps4 hardware was my initial goal but I quickly figured out I had a vast amount of learning to do to get there.</p> 

<p>I also need to change the link to the "pre-installed" folder, I had a brain fart and uploaded the folder instead of the tar.xz, once it is uploaded I will change the link to point to the tar.xz</p>

<p>The link now points to the tar.xz</p>
                </div>
            </div>

            <hr>
                    <div>
                                <h3>kevinF</h3>
                <div class="Post-body">
                    <p><a href="https://ps4linux.com/forums/d/130/3" class="PostMention" data-id="1105" rel="" target="">misfit-mischief</a> this "A.I." is for generating images did you find any that are the same as chatgpt but open source that works on ps4 linux?</p>
                </div>
            </div>

            <hr>
                    <div>
                                <h3>misfit-mischief</h3>
                <div class="Post-body">
                    <p><a href="https://ps4linux.com/forums/d/130/4" class="PostMention" data-id="1113" rel="" target="">kevinF</a> I have tried a few but I havent yet had any success. It should definitely be possible tho as they have versions that run only on a cpu.</p>


<p>Update:  gpt4all runs on ps4linux, I downloaded a 7b model that uses 8gb ram and it ran , again it runs pretty slow.<br>
<a href="https://i.imgur.com/pHaqeSL.jpg" rel="ugc noopener nofollow" target="_blank" rel="ugc noopener nofollow" target="_blank"><img src="https://i.imgur.com/pHaqeSLh.jpg" title="" alt=""></a></p>

<p><a href="https://mega.nz/file/OIlzyLqK#jRb5bgAkFon7HjiQb_mJxVt0FHvfWt5eMrgmsyQko8U" rel="ugc noopener nofollow" target="_blank" rel="ugc noopener nofollow" target="_blank">GPT4All-Installer</a> Once installed a gpt4all folder will be in the home folder. Inside is a maintenance tool that should be run. Once complete open the bin folder and run chat.<br>
It should prompt a model download.  The gui is pretty simple to figure out.</p> 

<p>For anyone interested, I've been testing different models and settings. So far <a href="https://huggingface.co/TheBloke/orca_mini_3B-GGML/tree/main" rel="ugc noopener nofollow" target="_blank" rel="ugc noopener nofollow" target="_blank">the q8 version</a> of this model has the fastest response.</p>

<p>As for settings I've set cpu threads to 6. Response generation is much quicker than any other I've tested<br>
<a href="https://i.imgur.com/YUmEKZi.png" rel="ugc noopener nofollow" target="_blank" rel="ugc noopener nofollow" target="_blank"><img src="https://i.imgur.com/YUmEKZih.png" title="" alt=""></a><br>
Each cpu thread ups the cpu usage when generating a response. 6 cpu threads uses between 75% -85% of cpu according to conky.</p>


                </div>
            </div>

            <hr>
                    <div>
                                <h3>misfit-mischief</h3>
                <div class="Post-body">
                    <p>Update: for those that want to run a local stable diffusion (text to image generator) setup, I highly recommend fastsd_cpu.</p>

<p>There are some requirements, but chances are you already have them installed.</p>
<ol style="list-style-type:decimal"><li>git installed </li>
<li>pip installed</li>
<li>qt5-qtbase-gui</li></ol>


<p>Use git clone to get the repo here   <a href="https://github.com/rupeshs/fastsdcpu" rel="ugc noopener nofollow" target="_blank" rel="ugc noopener nofollow" target="_blank">https://github.com/rupeshs/fastsdcpu</a></p>

<p>Open a terminal in the fastsdcpu folder you just cloned</p>

<p>Type <code>pip install -r requirements.txt</code> this part takes a little while</p>

<p>Once thats done go to fastsdcpu folder and right click install.sh, click permissions and make sure its executable. Then double click and a small window should pop up giving a choice to execute/execute in terminal, choose "in terminal", this part also take a little while</p>

<p>Once thats done you can double click start.sh, again it will give the same options as before again choose "in terminal"</p>

<p>Soon after a gui should pop up. If not and the terminal shows an error, it is most likely a qt issue ( figuring out the fix) in this case try using the start-webui.sh</p>

<p>If a browser doesnt auto open with the web ui you can open a browser and plug in the ip shown in terminal</p> 

<p>On the first run its going to take awhile since it first has to download the chosen model.<br>
I recommend the lcm-lora option its default lykon/dreamshaperv8 is pretty decent</p>
 
<p>Ive been using this for awhile and it works pretty well for what is  and what it is running on.<br>
For best results use the 1gb payload when booting linux, we want the most ram possible, also I would recommend an 8gb swap.</p>

<p>On 1gb payload a 512x512 image takes just under 20 seconds per step and I use a bare minimum of 4 steps per image<br>
Here is a few Ive generated on ps4linux using fastsdcpu <br>
<a href="https://i.imgur.com/TNQTAPU.png" rel="ugc noopener nofollow" target="_blank" rel="ugc noopener nofollow" target="_blank"><img src="https://i.imgur.com/TNQTAPU.png" title="" alt=""></a><br>
<a href="https://i.imgur.com/DzsknNl.png" rel="ugc noopener nofollow" target="_blank" rel="ugc noopener nofollow" target="_blank"><img src="https://i.imgur.com/DzsknNl.png" title="" alt=""></a><br>
<a href="https://i.imgur.com/BBBJ3Kq.png" rel="ugc noopener nofollow" target="_blank" rel="ugc noopener nofollow" target="_blank"><img src="https://i.imgur.com/BBBJ3Kq.png" title="" alt=""></a></p>

<p>If you have any questions, or any issues let me know and ill do my best to help.</p>

                </div>
            </div>

And probably some people had make the distro without know in deep what do (on fedora38 i have find a strange subdirectory with 6.* kernel files)<br>

And i want know how payload works. Why not load a tool for launch linux like grub,lilo or other?</p>

                                <h3>noob404</h3>
                <div class="Post-body">
                    <p><a href="https://ps4linux.com/forums/d/130/10" class="PostMention" data-id="1643" rel="" target="">Naxil</a> Truth be said, I don't claim to know 100% of what happens under the hood. But, here's my preliminary understanding.<br>
PS4 uses kexec bootloader which lets you switch kernel and initram without an actual reboot (you might have noticed that the PS4 doesn't actually shut down before booting into Linux). So, kexec is being used to switch from the FreeBSD kernel of Orbis to the other Linux kernel. With that being the basic way to boot into Linux for the time being, Grub will just be an additional unnecessary step. Instead of that though, if you are just looking to multi-boot, I already have the multi-boot initram.</p>

<p>Correct me if I am wrong.</p>

<p>Don't understand the rest of your questions.</p>

{"number":1,"createdAt":"2023-07-05T16:50:36+00:00","contentType":"comment","contentHtml":"\u003Cp\u003ESo a.i. seems to be the new buzz word around the tech world and non-tech world alike. I\u0027m sure most of us have at least heard about ChatGPT. There have also been a number of open source alternatives released thanks to the leak of llama source from Meta. After playing around with ChatGPT for a few hours, I  became curious if these things (llm or large language models) could be run locally on a home pc. I don\u0027t like the idea of feeding my data to for-profit companies.\u003C\/p\u003E\n\n\u003Cp\u003EThe short answer is: Yes these things can be run locally. The open source alternatives that have come about since the llama leak are numerous and growing every day!\u003C\/p\u003E \n\n\u003Cp\u003EUnfortunately, it seems for the majority of them someone would need a mid range gaming pc at minimum.\u003C\/p\u003E\n\n\u003Cp\u003EI wasn\u0027t (and am still not) sure what PC equivalent would\/could best be compared to ps4linux in terms of performance and capabilties. But I thought if I can play gta online on ps4linux surely I can get some kind of open source llm to run on ps4linux. I had already accepted that if I got anything like this to run on ps4linux it would very likely be pretty sub-par. So after some googling I was cloning gits left and right and following install instructions I barely understand lol. Admittedly what I know about ai, llm, etc. could be compared to what I knew about running linux on ps4 a year ago when I first started. I know its possible but don\u0027t know any of the inner workings yet.\u003C\/p\u003E\n\n\u003Cp\u003EEnough of the preamble tho, lets get down to it. Almost all my attempts to run any kind of ai, llm etc. on ps4linux have not been fruitful. I\u0027m sure it is possible, I just lack the know how at the moment. Notice I said \u0022almost all\u0022, yes friends thats right I have succeeded in getting one of these new fangled ai thingies running on ps4linux.\u003C\/p\u003E\n\n\u003Cp\u003EIf you havent heard about stable diffusion it\u0027s a text to image generator. You type a description and it outputs an image based on your text. It does indeed run on ps4linux. Now I won\u0027t pretend that it runs well, but it does run and generate an image.\u003C\/p\u003E\n\n\u003Cp\u003E\u003Ca href=\u0022https:\/\/github.com\/easydiffusion\/easydiffusion\u0022 rel=\u0022ugc noopener nofollow\u0022 target=\u0022_blank\u0022 rel=\u0022ugc noopener nofollow\u0022 target=\u0022_blank\u0022\u003EHere\u003C\/a\u003E is the link that I followed to install. But before you rush there to learn how to install\/run this for yourself, I should warn you all my attempts to install directly on ps4linux resulted in timeout errors and drive space (even tho I know the drive has enough free space) errors.\u003C\/p\u003E\n\n \u003Cp\u003EI posted the link primarily to be a guide on what to do once it is installed. In the end I used the linux side of my highly outdated dual-boot desktop pc (intel core 2 duo with no gpu lol) to install. Once it was successfully installed on desktop (no errors) it tried to run on desktop but it more or less just locked up the pc, which was more than expected on a potatoe posing as a pc lol.\u003C\/p\u003E \n \n\u003Cp\u003EMy next step was to copy the file folder from potatoe to ps4linux, on first attempt I copied it to my main (daily driver\/gaming) install, the same install I\u0027m typing this on now. The result was less than I had hoped as it still would not run. After that I thought that maybe my prior attempts at various other ai installations was the problem.\u003C\/p\u003E\n\n \u003Cp\u003EI noticed when I tried running some of those prior installations that it was trying to install oudated versions of required libraries and such. So my next thought was to try it on a fresh install. I did a fresh install and attempted to install directly on ps4linux using the above link, and much to my dismay it returned the same timeout, drive space errors. I then copied the file folder from the desktop to the fresh install and it flipping ran.\u003C\/p\u003E\n\n  \u003Cp\u003EI have uploaded the file folder \u003Ca href=\u0022https:\/\/mega.nz\/file\/bM8xBSbS#8xCj6X6zvr-6sKSKIVj5GEgflBlQhcskwIpa9rp8NJQ\u0022 rel=\u0022ugc noopener nofollow\u0022 target=\u0022_blank\u0022 rel=\u0022ugc noopener nofollow\u0022 target=\u0022_blank\u0022\u003Ehere\u003C\/a\u003E for anyone else who wants to attempt this. This does run on ps4linux but not as well as I initially hoped, but it does run.  It took around 2-3 hours to output an image from my text input. It also used the 4gb of ram and 6gb of my 8gb swap. I only did the one test and didnt mess with any settings whatsoever.  After about a week of trial and error (git cloning,following install instructions, etc.) with something I barely understand I\u0027m counting this as a win.\u003C\/p\u003E \n\n\u003Cp\u003EThis got a lot more long winded than I had Intended, I just tried to include as much info as I could think of.\u003C\/p\u003E","renderFailed":false,"editedAt":"2023-07-05T20:06:51+00:00","canEdit":false,"canDelete":false,"canHide":false,"canFlag":false,"isApproved":true,"canApprove":false,"canLike":false,"canViewEditHistory":false,"canDeleteEditHistory":false,"canRollbackEditHistory":false,"revisionCount":4,"bookmarked":false},"relationships":{"discussion":{"data":{"type":"discussions","id":"130"}},"user":{"data":{"type":"users","id":"67"}},"editedUser":{"data":{"type":"users","id":"67"}},"likes":{"data":[{"type":"users","id":"1"},{"type":"users","id":"70"}]},"mentionedBy":{"data":[]}}},{"type":"posts","id":"1103","attributes":{"number":2,"createdAt":"2023-07-05T17:36:41+00:00","contentType":"comment","contentHtml":"\u003Cp\u003EI did some ai powered wardriving (WiFi Hacking) with pwnagotchi in past. \u003Cbr\u003E\n\u003Ca href=\u0022https:\/\/pwnagotchi.ai\/\u0022 rel=\u0022ugc noopener nofollow\u0022 target=\u0022_blank\u0022 rel=\u0022ugc noopener nofollow\u0022 target=\u0022_blank\u0022\u003Ehttps:\/\/pwnagotchi.ai\/\u003C\/a\u003E\u003Cbr\u003E\nIntersting but very complex stuff. But train an ai with ps4 GPU power sounds good.\u003C\/p\u003E","renderFailed":false,"editedAt":"2023-07-05T17:37:21+00:00","canEdit":false,"canDelete":false,"canHide":false,"canFlag":false,"isApproved":true,"canApprove":false,"canLike":false,"canViewEditHistory":false,"canDeleteEditHistory":false,"canRollbackEditHistory":false,"revisionCount":1,"bookmarked":false},"relationships":{"discussion":{"data":{"type":"discussions","id":"130"}},"user":{"data":{"type":"users","id":"70"}},"editedUser":{"data":{"type":"users","id":"70"}},"likes":{"data":[]},"mentionedBy":{"data":[{"type":"posts","id":"1105"}]}}},{"type":"posts","id":"1105","attributes":{"number":3,"createdAt":"2023-07-05T18:19:24+00:00","contentType":"comment","contentHtml":"\u003Cp\u003E\u003Ca href=\u0022https:\/\/ps4linux.com\/forums\/d\/130\/2\u0022 class=\u0022PostMention\u0022 data-id=\u00221103\u0022 rel=\u0022\u0022 target=\u0022\u0022\u003Etastebin\u003C\/a\u003E I agree that does sound good. Training an ai running linux on ps4 hardware was my initial goal but I quickly figured out I had a vast amount of learning to do to get there.\u003C\/p\u003E \n\n\u003Cp\u003EI also need to change the link to the \u0022pre-installed\u0022 folder, I had a brain fart and uploaded the folder instead of the tar.xz, once it is uploaded I will change the link to point to the tar.xz\u003C\/p\u003E\n\n\u003Cp\u003EThe link now points to the tar.xz\u003C\/p\u003E","renderFailed":false,"editedAt":"2023-07-05T20:08:52+00:00","canEdit":false,"canDelete":false,"canHide":false,"canFlag":false,"isApproved":true,"canApprove":false,"canLike":false,"canViewEditHistory":false,"canDeleteEditHistory":false,"canRollbackEditHistory":false,"revisionCount":2,"bookmarked":false},"relationships":{"user":{"data":{"type":"users","id":"67"}},"discussion":{"data":{"type":"discussions","id":"130"}},"editedUser":{"data":{"type":"users","id":"67"}},"likes":{"data":[{"type":"users","id":"70"}]},"mentionedBy":{"data":[{"type":"posts","id":"1113"}]}}},{"type":"posts","id":"1113","attributes":{"number":4,"createdAt":"2023-07-08T12:23:04+00:00","contentType":"comment","contentHtml":"\u003Cp\u003E\u003Ca href=\u0022https:\/\/ps4linux.com\/forums\/d\/130\/3\u0022 class=\u0022PostMention\u0022 data-id=\u00221105\u0022 rel=\u0022\u0022 target=\u0022\u0022\u003Emisfit-mischief\u003C\/a\u003E this \u0022A.I.\u0022 is for generating images did you find any that are the same as chatgpt but open source that works on ps4 linux?\u003C\/p\u003E","renderFailed":false,"canEdit":false,"canDelete":false,"canHide":false,"canFlag":false,"isApproved":true,"canApprove":false,"canLike":false,"canViewEditHistory":false,"canDeleteEditHistory":false,"canRollbackEditHistory":false,"revisionCount":0,"bookmarked":false},"relationships":{"user":{"data":{"type":"users","id":"44"}},"discussion":{"data":{"type":"discussions","id":"130"}},"likes":{"data":[]},"mentionedBy":{"data":[{"type":"posts","id":"1114"}]}}},{"type":"posts","id":"1114","attributes":{"number":5,"createdAt":"2023-07-08T12:37:49+00:00","contentType":"comment","contentHtml":"\u003Cp\u003E\u003Ca href=\u0022https:\/\/ps4linux.com\/forums\/d\/130\/4\u0022 class=\u0022PostMention\u0022 data-id=\u00221113\u0022 rel=\u0022\u0022 target=\u0022\u0022\u003EkevinF\u003C\/a\u003E I have tried a few but I havent yet had any success. It should definitely be possible tho as they have versions that run only on a cpu.\u003C\/p\u003E\n\n\n\u003Cp\u003EUpdate:  gpt4all runs on ps4linux, I downloaded a 7b model that uses 8gb ram and it ran , again it runs pretty slow.\u003Cbr\u003E\n\u003Ca href=\u0022https:\/\/i.imgur.com\/pHaqeSL.jpg\u0022 rel=\u0022ugc noopener nofollow\u0022 target=\u0022_blank\u0022 rel=\u0022ugc noopener nofollow\u0022 target=\u0022_blank\u0022\u003E\u003Cimg src=\u0022https:\/\/i.imgur.com\/pHaqeSLh.jpg\u0022 title=\u0022\u0022 alt=\u0022\u0022\u003E\u003C\/a\u003E\u003C\/p\u003E\n\n\u003Cp\u003E\u003Ca href=\u0022https:\/\/mega.nz\/file\/OIlzyLqK#jRb5bgAkFon7HjiQb_mJxVt0FHvfWt5eMrgmsyQko8U\u0022 rel=\u0022ugc noopener nofollow\u0022 target=\u0022_blank\u0022 rel=\u0022ugc noopener nofollow\u0022 target=\u0022_blank\u0022\u003EGPT4All-Installer\u003C\/a\u003E Once installed a gpt4all folder will be in the home folder. Inside is a maintenance tool that should be run. Once complete open the bin folder and run chat.\u003Cbr\u003E\nIt should prompt a model download.  The gui is pretty simple to figure out.\u003C\/p\u003E \n\n\u003Cp\u003EFor anyone interested, I\u0027ve been testing different models and settings. So far \u003Ca href=\u0022https:\/\/huggingface.co\/TheBloke\/orca_mini_3B-GGML\/tree\/main\u0022 rel=\u0022ugc noopener nofollow\u0022 target=\u0022_blank\u0022 rel=\u0022ugc noopener nofollow\u0022 target=\u0022_blank\u0022\u003Ethe q8 version\u003C\/a\u003E of this model has the fastest response.\u003C\/p\u003E\n\n\u003Cp\u003EAs for settings I\u0027ve set cpu threads to 6. Response generation is much quicker than any other I\u0027ve tested\u003Cbr\u003E\n\u003Ca href=\u0022https:\/\/i.imgur.com\/YUmEKZi.png\u0022 rel=\u0022ugc noopener nofollow\u0022 target=\u0022_blank\u0022 rel=\u0022ugc noopener nofollow\u0022 target=\u0022_blank\u0022\u003E\u003Cimg src=\u0022https:\/\/i.imgur.com\/YUmEKZih.png\u0022 title=\u0022\u0022 alt=\u0022\u0022\u003E\u003C\/a\u003E\u003Cbr\u003E\nEach cpu thread ups the cpu usage when generating a response. 6 cpu threads uses between 75% -85% of cpu according to conky.\u003C\/p\u003E\n\n","renderFailed":false,"editedAt":"2023-07-12T16:23:02+00:00","canEdit":false,"canDelete":false,"canHide":false,"canFlag":false,"isApproved":true,"canApprove":false,"canLike":false,"canViewEditHistory":false,"canDeleteEditHistory":false,"canRollbackEditHistory":false,"revisionCount":9,"bookmarked":false},"relationships":{"user":{"data":{"type":"users","id":"67"}},"discussion":{"data":{"type":"discussions","id":"130"}},"editedUser":{"data":{"type":"users","id":"67"}},"likes":{"data":[]},"mentionedBy":{"data":[]}}},{"type":"posts","id":"1632","attributes":{"number":6,"createdAt":"2024-01-31T19:51:17+00:00","contentType":"comment","contentHtml":"\u003Cp\u003EUpdate: for those that want to run a local stable diffusion (text to image generator) setup, I highly recommend fastsd_cpu.\u003C\/p\u003E\n\n\u003Cp\u003EThere are some requirements, but chances are you already have them installed.\u003C\/p\u003E\n\u003Col style=\u0022list-style-type:decimal\u0022\u003E\u003Cli\u003Egit installed \u003C\/li\u003E\n\u003Cli\u003Epip installed\u003C\/li\u003E\n\u003Cli\u003Eqt5-qtbase-gui\u003C\/li\u003E\u003C\/ol\u003E\n\n\n\u003Cp\u003EUse git clone to get the repo here   \u003Ca href=\u0022https:\/\/github.com\/rupeshs\/fastsdcpu\u0022 rel=\u0022ugc noopener nofollow\u0022 target=\u0022_blank\u0022 rel=\u0022ugc noopener nofollow\u0022 target=\u0022_blank\u0022\u003Ehttps:\/\/github.com\/rupeshs\/fastsdcpu\u003C\/a\u003E\u003C\/p\u003E\n\n\u003Cp\u003EOpen a terminal in the fastsdcpu folder you just cloned\u003C\/p\u003E\n\n\u003Cp\u003EType \u003Ccode\u003Epip install -r requirements.txt\u003C\/code\u003E this part takes a little while\u003C\/p\u003E\n\n\u003Cp\u003EOnce thats done go to fastsdcpu folder and right click install.sh, click permissions and make sure its executable. Then double click and a small window should pop up giving a choice to execute\/execute in terminal, choose \u0022in terminal\u0022, this part also take a little while\u003C\/p\u003E\n\n\u003Cp\u003EOnce thats done you can double click start.sh, again it will give the same options as before again choose \u0022in terminal\u0022\u003C\/p\u003E\n\n\u003Cp\u003ESoon after a gui should pop up. If not and the terminal shows an error, it is most likely a qt issue ( figuring out the fix) in this case try using the start-webui.sh\u003C\/p\u003E\n\n\u003Cp\u003EIf a browser doesnt auto open with the web ui you can open a browser and plug in the ip shown in terminal\u003C\/p\u003E \n\n\u003Cp\u003EOn the first run its going to take awhile since it first has to download the chosen model.\u003Cbr\u003E\nI recommend the lcm-lora option its default lykon\/dreamshaperv8 is pretty decent\u003C\/p\u003E\n \n\u003Cp\u003EIve been using this for awhile and it works pretty well for what is  and what it is running on.\u003Cbr\u003E\nFor best results use the 1gb payload when booting linux, we want the most ram possible, also I would recommend an 8gb swap.\u003C\/p\u003E\n\n\u003Cp\u003EOn 1gb payload a 512x512 image takes just under 20 seconds per step and I use a bare minimum of 4 steps per image\u003Cbr\u003E\nHere is a few Ive generated on ps4linux using fastsdcpu \u003Cbr\u003E\n\u003Ca href=\u0022https:\/\/i.imgur.com\/TNQTAPU.png\u0022 rel=\u0022ugc noopener nofollow\u0022 target=\u0022_blank\u0022 rel=\u0022ugc noopener nofollow\u0022 target=\u0022_blank\u0022\u003E\u003Cimg src=\u0022https:\/\/i.imgur.com\/TNQTAPU.png\u0022 title=\u0022\u0022 alt=\u0022\u0022\u003E\u003C\/a\u003E\u003Cbr\u003E\n\u003Ca href=\u0022https:\/\/i.imgur.com\/DzsknNl.png\u0022 rel=\u0022ugc noopener nofollow\u0022 target=\u0022_blank\u0022 rel=\u0022ugc noopener nofollow\u0022 target=\u0022_blank\u0022\u003E\u003Cimg src=\u0022https:\/\/i.imgur.com\/DzsknNl.png\u0022 title=\u0022\u0022 alt=\u0022\u0022\u003E\u003C\/a\u003E\u003Cbr\u003E\n\u003Ca href=\u0022https:\/\/i.imgur.com\/BBBJ3Kq.png\u0022 rel=\u0022ugc noopener nofollow\u0022 target=\u0022_blank\u0022 rel=\u0022ugc noopener nofollow\u0022 target=\u0022_blank\u0022\u003E\u003Cimg src=\u0022https:\/\/i.imgur.com\/BBBJ3Kq.png\u0022 title=\u0022\u0022 alt=\u0022\u0022\u003E\u003C\/a\u003E\u003C\/p\u003E\n\n\u003Cp\u003EIf you have any questions, or any issues let me know and ill do my best to help.\u003C\/p\u003E\n","renderFailed":false,"editedAt":"2024-01-31T22:04:13+00:00","canEdit":false,"canDelete":false,"canHide":false,"canFlag":false,"isApproved":true,"canApprove":false,"canLike":false,"canViewEditHistory":false,"canDeleteEditHistory":false,"canRollbackEditHistory":false,"revisionCount":3,"bookmarked":false},"relationships":{"discussion":{"data":{"type":"discussions","id":"130"}},"user":{"data":{"type":"users","id":"67"}},"editedUser":{"data":{"type":"users","id":"67"}},"likes":{"data":[{"type":"users","id":"1"}]},"mentionedBy":{"data":[]}}},{"type":"posts","id":"1636","attributes":{"number":7,"createdAt":"2024-02-02T13:27:36+00:00","contentType":"comment","contentHtml":"\u003Cp\u003EThis is cool.\u003C\/p\u003E","renderFailed":false,"canEdit":false,"canDelete":false,"canHide":false,"canFlag":false,"isApproved":true,"canApprove":false,"canLike":false,"canViewEditHistory":false,"canDeleteEditHistory":false,"canRollbackEditHistory":false,"revisionCount":0,"bookmarked":false},"relationships":{"discussion":{"data":{"type":"discussions","id":"130"}},"user":{"data":{"type":"users","id":"1"}},"likes":{"data":[]},"mentionedBy":{"data":[]}}},{"type":"posts","id":"1640","attributes":{"number":8,"createdAt":"2024-02-05T14:59:35+00:00","contentType":"comment","contentHtml":"\u003Cp\u003EWhat distro do you use? What is fastdcpu?\u003C\/p\u003E","renderFailed":false,"canEdit":false,"canDelete":false,"canHide":false,"canFlag":false,"isApproved":true,"canApprove":false,"canLike":false,"canViewEditHistory":false,"canDeleteEditHistory":false,"canRollbackEditHistory":false,"revisionCount":0,"bookmarked":false},"relationships":{"discussion":{"data":{"type":"discussions","id":"130"}},"user":{"data":{"type":"users","id":"189"}},"likes":{"data":[]},"mentionedBy":{"data":[{"type":"posts","id":"1642"}]}}},{"type":"posts","id":"1642","attributes":{"number":9,"createdAt":"2024-02-06T06:41:20+00:00","contentType":"comment","contentHtml":"\u003Cp\u003E\u003Ca href=\u0022https:\/\/ps4linux.com\/forums\/d\/130\/8\u0022 class=\u0022PostMention\u0022 data-id=\u00221640\u0022 rel=\u0022\u0022 target=\u0022\u0022\u003ENaxil\u003C\/a\u003E Program to enable faster AI-related work on CPU.\u003C\/p\u003E","renderFailed":false,"canEdit":false,"canDelete":false,"canHide":false,"canFlag":false,"isApproved":true,"canApprove":false,"canLike":false,"canViewEditHistory":false,"canDeleteEditHistory":false,"canRollbackEditHistory":false,"revisionCount":0,"bookmarked":false},"relationships":{"user":{"data":{"type":"users","id":"1"}},"discussion":{"data":{"type":"discussions","id":"130"}},"likes":{"data":[]},"mentionedBy":{"data":[{"type":"posts","id":"1643"}]}}},{"type":"posts","id":"1643","attributes":{"number":10,"createdAt":"2024-02-06T06:55:42+00:00","contentType":"comment","contentHtml":"\u003Cp\u003E\u003Ca href=\u0022https:\/\/ps4linux.com\/forums\/d\/130\/9\u0022 class=\u0022PostMention\u0022 data-id=\u00221642\u0022 rel=\u0022\u0022 target=\u0022\u0022\u003Enoob404\u003C\/a\u003E is possible know how ps4 distro.works? Because some part isnt regular like normal distro (kernel and other part). Proc folder dont exist ecc ecc (lsmod not works at all).\u003Cbr\u003E\nAnd probably some people had make the distro without know in deep what do (on fedora38 i have find a strange subdirectory with 6.* kernel files)\u003Cbr\u003E\nDistro makers lot of time say = update mesa,kernel,distro when mesa without pc never works and kernel cant be updated at all.\u003Cbr\u003E\nAnd i want know how payload works. Why not load a tool for launch linux like grub,lilo or other?\u003C\/p\u003E","renderFailed":false,"canEdit":false,"canDelete":false,"canHide":false,"canFlag":false,"isApproved":true,"canApprove":false,"canLike":false,"canViewEditHistory":false,"canDeleteEditHistory":false,"canRollbackEditHistory":false,"revisionCount":0,"bookmarked":false},"relationships":{"user":{"data":{"type":"users","id":"189"}},"discussion":{"data":{"type":"discussions","id":"130"}},"likes":{"data":[]},"mentionedBy":{"data":[{"type":"posts","id":"1647"}]}}},{"type":"posts","id":"1647","attributes":{"number":11,"createdAt":"2024-02-07T15:48:51+00:00","contentType":"comment","contentHtml":"\u003Cp\u003E\u003Ca href=\u0022https:\/\/ps4linux.com\/forums\/d\/130\/10\u0022 class=\u0022PostMention\u0022 data-id=\u00221643\u0022 rel=\u0022\u0022 target=\u0022\u0022\u003ENaxil\u003C\/a\u003E Truth be said, I don\u0027t claim to know 100% of what happens under the hood. But, here\u0027s my preliminary understanding.\u003Cbr\u003E\nPS4 uses kexec bootloader which lets you switch kernel and initram without an actual reboot (you might have noticed that the PS4 doesn\u0027t actually shut down before booting into Linux). So, kexec is being used to switch from the FreeBSD kernel of Orbis to the other Linux kernel. With that being the basic way to boot into Linux for the time being, Grub will just be an additional unnecessary step. Instead of that though, if you are just looking to multi-boot, I already have the multi-boot initram.\u003C\/p\u003E\n\n\u003Cp\u003ECorrect me if I am wrong.\u003C\/p\u003E\n\n\u003Cp\u003EDon\u0027t understand the rest of your questions.\u003C\/p\u003E","renderFailed":false,"canEdit":false,"canDelete":false,"canHide":false,"canFlag":false,"isApproved":true,"canApprove":false,"canLike":false,"canViewEditHistory":false,"canDeleteEditHistory":false,"canRollbackEditHistory":false,"revisionCount":0,"bookmarked":false},"relationships":{"user":{"data":{"type":"users","id":"1"}},"discussion":{"data":{"type":"discussions","id":"130"}},"likes":{"data":[]},"mentionedBy":{"data":[]}}},{"type":"posts","id":"1648","attributes":{"number":12,"createdAt":"2024-02-07T16:45:29+00:00","contentType":"comment","contentHtml":"\u003Cp\u003EOk you are right. But after that some module functionality cant be used. Or probably iam not able to do it. Because my wifi\/bt sometimes work sometimes not (you know i have torus2 i give to you my sys file on discord), i want find a way to reload\/restart the wifi\/bt module. Or what we can do for have good bzim
