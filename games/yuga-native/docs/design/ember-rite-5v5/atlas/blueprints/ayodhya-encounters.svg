<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1030" viewBox="0 0 1440 1030" role="img" aria-labelledby="title description">
  <title id="title">Ayodhya — round rehearsal and prop schedule</title>
  <desc id="description">Uncontested walking budgets, landmark callouts, cover elevations and shoulder-camera test lines.</desc>
  <rect x="0" y="0" width="1440" height="1030" fill="#f8f5eb" />
  <rect x="0" y="0" width="1440" height="8" fill="#203c40" />
  <text x="44" y="43" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" letter-spacing="1.25">YUGA    /    EMBER RITE</text>
  <text x="1396" y="43" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="end" letter-spacing="1.1">LEVEL DESIGN     /     SHEET 06 OF 08</text>
  <text x="42" y="100" fill="#203c40" font-family="DejaVu Serif, serif" font-size="43">Ayodhya  /  Encounter notes</text>
  <text x="44" y="139" fill="#455f61" font-family="DejaVu Sans, sans-serif" font-size="19">Carry the vessel, draw a response, and leave a route back to the fire.</text>
  <line x1="44" y1="159" x2="1396" y2="159" stroke="#203c40" stroke-width="1.3" />
  <text x="44" y="188" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" letter-spacing="1.25">RETAKE FROM THE OPPOSITE SITE</text>
  <text x="770" y="188" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" letter-spacing="1.25">LANDMARKS AT PLAYER HEIGHT AND ON THE SKYLINE</text>
  <text x="45" y="225" fill="#203c40" font-family="DejaVu Serif, serif" font-size="22">How much time does a late retake leave?</text>
  <rect x="45" y="256" width="451.05" height="18" fill="#42796c" />
  <rect x="496.05" y="256" width="56.35" height="18" fill="#ad5430" />
  <rect x="552.4" y="256" width="136.6" height="18" fill="#e0e7d5" />
  <line x1="45" y1="274" x2="45" y2="280" stroke="#203c40" stroke-width="1" />
  <text x="45" y="296" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="12" text-anchor="start">0 s</text>
  <line x1="206" y1="274" x2="206" y2="280" stroke="#203c40" stroke-width="1" />
  <text x="206" y="296" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="12" text-anchor="middle">10 s</text>
  <line x1="367" y1="274" x2="367" y2="280" stroke="#203c40" stroke-width="1" />
  <text x="367" y="296" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="12" text-anchor="middle">20 s</text>
  <line x1="528" y1="274" x2="528" y2="280" stroke="#203c40" stroke-width="1" />
  <text x="528" y="296" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="12" text-anchor="middle">30 s</text>
  <line x1="689" y1="274" x2="689" y2="280" stroke="#203c40" stroke-width="1" />
  <text x="689" y="296" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="12" text-anchor="end">40 s</text>
  <rect x="45" y="313" width="10" height="10" fill="#42796c" />
  <text x="62" y="323" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="14">Walk  28.0 s</text>
  <rect x="247" y="313" width="10" height="10" fill="#ad5430" />
  <text x="264" y="323" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="14">Quench  3.5 s</text>
  <rect x="453" y="313" width="10" height="10" fill="#768968" />
  <text x="470" y="323" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="14">Time to react and fight  8.5 s</text>
  <text x="45" y="354" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="16">Assembly Court → Ledger Court → Sluice Gate → Wash Steps → Ferry Quay</text>
  <text x="45" y="405" fill="#455f61" font-family="DejaVu Sans, sans-serif" font-size="14">With the optional crossings open, the fastest rotation takes 24.5 s.</text>
  <line x1="44" y1="423" x2="713" y2="423" stroke="#a8b8ae" stroke-width="1" />
  <text x="44" y="450" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" letter-spacing="1.25">OPENING ASSIGNMENTS   /   DRY WALKING TIME</text>
  <text x="329" y="482" fill="#455f61" font-family="DejaVu Sans, sans-serif" font-size="15">Attack spawn</text>
  <text x="527" y="482" fill="#455f61" font-family="DejaVu Sans, sans-serif" font-size="15">Defend spawn</text>
  <text x="44" y="514" fill="#203c40" font-family="DejaVu Serif, serif" font-size="18">Assembly Court</text>
  <text x="329" y="514" fill="#203c40" font-family="DejaVu Sans Mono, monospace" font-size="16">23.3 s</text>
  <text x="527" y="514" fill="#203c40" font-family="DejaVu Sans Mono, monospace" font-size="16">24.2 s</text>
  <text x="44" y="545" fill="#203c40" font-family="DejaVu Serif, serif" font-size="18">Ferry Quay</text>
  <text x="329" y="545" fill="#203c40" font-family="DejaVu Sans Mono, monospace" font-size="16">17.9 s</text>
  <text x="527" y="545" fill="#203c40" font-family="DejaVu Sans Mono, monospace" font-size="16">19.0 s</text>
  <text x="44" y="576" fill="#203c40" font-family="DejaVu Serif, serif" font-size="18">Ledger Court</text>
  <text x="329" y="576" fill="#203c40" font-family="DejaVu Sans Mono, monospace" font-size="16">24.3 s</text>
  <text x="527" y="576" fill="#203c40" font-family="DejaVu Sans Mono, monospace" font-size="16">23.3 s</text>
  <text x="44" y="607" fill="#455f61" font-family="DejaVu Sans, sans-serif" font-size="14">Centreline estimates at 5 m/s, before peeks, fighting and the final step to the vessel.</text>
  <text x="770" y="225" fill="#203c40" font-family="DejaVu Serif, serif" font-size="22">Petition canopy</text>
  <text x="1395" y="225" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="14" text-anchor="end">Assembly Court</text>
  <text x="770" y="252" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="15">A shallow fan roof marks the assembly entrance from the uphill street.</text>
  <text x="770" y="320" fill="#203c40" font-family="DejaVu Serif, serif" font-size="22">Measure beam</text>
  <text x="1395" y="320" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="14" text-anchor="end">Ledger Court</text>
  <text x="770" y="347" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="15">A horizontal stone measure points to the river exit. Back it with plain</text>
  <text x="770" y="368" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="15">plaster so heroes read clearly.</text>
  <text x="770" y="415" fill="#203c40" font-family="DejaVu Serif, serif" font-size="22">Flood gauge</text>
  <text x="1395" y="415" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="14" text-anchor="end">Gauge Steps</text>
  <text x="770" y="442" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="15">Three large steps and ruled ceramic tiles identify the dry eastern</text>
  <text x="770" y="463" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="15">approach without relying on hue.</text>
  <text x="770" y="510" fill="#203c40" font-family="DejaVu Serif, serif" font-size="22">Twin drums</text>
  <text x="1395" y="510" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="14" text-anchor="end">Ferry Quay</text>
  <text x="770" y="537" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="15">Paired mooring drums at the back of the landing identify the lower site</text>
  <text x="770" y="558" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="15">from both river approaches.</text>
  <line x1="44" y1="631" x2="1396" y2="631" stroke="#203c40" stroke-width="1.1" />
  <text x="44" y="658" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" letter-spacing="1.25">COVER SCHEDULE   /   FRONT ELEVATIONS FACING NORTH</text>
  <text x="1396" y="658" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="end">Dashed guide at 1.7 m</text>
  <rect x="107.57" y="725" width="66" height="55" fill="#34494c" stroke="#203c40" stroke-width="0.8" />
  <rect x="289.71" y="756.9" width="88" height="23.1" fill="#34494c" stroke="#203c40" stroke-width="0.8" />
  <rect x="482.86" y="727.2" width="88" height="52.8" fill="#34494c" stroke="#203c40" stroke-width="0.8" />
  <rect x="687" y="755.8" width="66" height="24.2" fill="#34494c" stroke="#203c40" stroke-width="0.8" />
  <rect x="880.14" y="725" width="66" height="55" fill="#34494c" stroke="#203c40" stroke-width="0.8" />
  <rect x="1073.29" y="753.6" width="66" height="26.4" fill="#34494c" stroke="#203c40" stroke-width="0.8" />
  <rect x="1277.43" y="755.8" width="44" height="24.2" fill="#34494c" stroke="#203c40" stroke-width="0.8" />
  <line x1="44" y1="780" x2="1396" y2="780" stroke="#203c40" stroke-width="1" />
  <line x1="44" y1="742.6" x2="1396" y2="742.6" stroke="#a77b5b" stroke-width="1.3" stroke-dasharray="5 4" />
  <text x="140.57" y="804" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">C1   2.5 m high</text>
  <text x="140.57" y="827" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle">Petition screen</text>
  <text x="140.57" y="865" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">3 × 5 m</text>
  <text x="333.71" y="804" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">C2   1.05 m high</text>
  <text x="333.71" y="827" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle">Scribe bench</text>
  <text x="333.71" y="865" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">4 × 3 m</text>
  <text x="526.86" y="804" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">C3   2.4 m high</text>
  <text x="526.86" y="827" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle">Ferry winch</text>
  <text x="526.86" y="865" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">4 × 4 m</text>
  <text x="720" y="804" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">C4   1.1 m high</text>
  <text x="720" y="827" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle">Quay kerb</text>
  <text x="720" y="865" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">3 × 3 m</text>
  <text x="913.14" y="804" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">C5   2.5 m high</text>
  <text x="913.14" y="827" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle">Ledger cabinet</text>
  <text x="913.14" y="865" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">3 × 3 m</text>
  <text x="1106.29" y="804" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">C6   1.2 m high</text>
  <text x="1106.29" y="827" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle">Gauge plinth</text>
  <text x="1106.29" y="865" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">3 × 4 m</text>
  <text x="1299.43" y="804" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">C7   1.1 m high</text>
  <text x="1299.43" y="827" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle">Wash parapet</text>
  <text x="1299.43" y="865" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">2 × 3 m</text>
  <line x1="44" y1="883" x2="1396" y2="883" stroke="#a8b8ae" stroke-width="1" />
  <text x="44" y="908" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" letter-spacing="1.25">SHOULDER-CAMERA TESTS</text>
  <text x="44" y="939" fill="#203c40" font-family="DejaVu Serif, serif" font-size="20">Gauge descent</text>
  <text x="44" y="963" fill="#455f61" font-family="DejaVu Sans, sans-serif" font-size="14">19.0 m in plan  /  clear in plan</text>
  <text x="729" y="939" fill="#203c40" font-family="DejaVu Serif, serif" font-size="20">Wash exit</text>
  <text x="729" y="963" fill="#455f61" font-family="DejaVu Sans, sans-serif" font-size="14">6.0 m in plan  /  clear in plan</text>
  <line x1="44" y1="984" x2="1396" y2="984" stroke="#203c40" stroke-width="1" />
  <text x="44" y="1009" fill="#455f61" font-family="DejaVu Sans, sans-serif" font-size="14">Test from both ends, both shoulders, and at the near and far lips of the planted vessel.</text>
  <text x="1396" y="1009" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="12" text-anchor="end">Design rehearsal    /    Ember Rite · 5v5</text>
</svg>
