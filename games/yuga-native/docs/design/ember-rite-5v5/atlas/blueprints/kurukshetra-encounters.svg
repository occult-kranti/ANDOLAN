<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1030" viewBox="0 0 1440 1030" role="img" aria-labelledby="title description">
  <title id="title">Kurukshetra — round rehearsal and prop schedule</title>
  <desc id="description">Uncontested walking budgets, landmark callouts, cover elevations and shoulder-camera test lines.</desc>
  <rect x="0" y="0" width="1440" height="1030" fill="#f8f5eb" />
  <rect x="0" y="0" width="1440" height="8" fill="#203c40" />
  <text x="44" y="43" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" letter-spacing="1.25">YUGA    /    EMBER RITE</text>
  <text x="1396" y="43" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="end" letter-spacing="1.1">LEVEL DESIGN     /     SHEET 08 OF 08</text>
  <text x="42" y="100" fill="#203c40" font-family="DejaVu Serif, serif" font-size="43">Kurukshetra  /  Encounter notes</text>
  <text x="44" y="139" fill="#455f61" font-family="DejaVu Sans, sans-serif" font-size="19">Carry the vessel, draw a response, and leave a route back to the fire.</text>
  <line x1="44" y1="159" x2="1396" y2="159" stroke="#203c40" stroke-width="1.3" />
  <text x="44" y="188" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" letter-spacing="1.25">RETAKE FROM THE OPPOSITE SITE</text>
  <text x="770" y="188" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" letter-spacing="1.25">LANDMARKS AT PLAYER HEIGHT AND ON THE SKYLINE</text>
  <text x="45" y="225" fill="#203c40" font-family="DejaVu Serif, serif" font-size="22">How much time does a late retake leave?</text>
  <rect x="45" y="256" width="352.42" height="18" fill="#42796c" />
  <rect x="397.42" y="256" width="56.35" height="18" fill="#ad5430" />
  <rect x="453.77" y="256" width="235.23" height="18" fill="#e0e7d5" />
  <line x1="45" y1="274" x2="45" y2="280" stroke="#203c40" stroke-width="1" />
  <text x="45" y="296" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="12" text-anchor="start">0 s</text>
  <line x1="206" y1="274" x2="206" y2="280" stroke="#203c40" stroke-width="1" />
  <text x="206" y="296" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="12" text-anchor="middle">10 s</text>
  <line x1="367" y1="274" x2="367" y2="280" stroke="#203c40" stroke-width="1" />
  <text x="367" y="296" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="12" text-anchor="middle">20 s</text>
  <line x1="528" y1="274" x2="528" y2="280" stroke="#203c40" stroke-width="1" />
  <text x="528" y="296" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="12" text-anchor="middle">30 s</text>
  <line x1="689" y1="274" x2="689" y2="280" stroke="#203c40" stroke-width="1" />
  <text x="689" y="296" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="12" text-anchor="end">40 s</text>
  <rect x="45" y="313" width="10" height="10" fill="#42796c" />
  <text x="62" y="323" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="14">Walk  21.9 s</text>
  <rect x="247" y="313" width="10" height="10" fill="#ad5430" />
  <text x="264" y="323" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="14">Quench  3.5 s</text>
  <rect x="453" y="313" width="10" height="10" fill="#768968" />
  <text x="470" y="323" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="14">Time to react and fight  14.6 s</text>
  <text x="45" y="354" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="16">Palace Terrace → Seal Porch → Gauge Bridge → Tally Steps → Wind Field</text>
  <text x="45" y="405" fill="#455f61" font-family="DejaVu Sans, sans-serif" font-size="14">Opening optional crossings leaves the fastest rotation time unchanged.</text>
  <line x1="44" y1="423" x2="713" y2="423" stroke="#a8b8ae" stroke-width="1" />
  <text x="44" y="450" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" letter-spacing="1.25">OPENING ASSIGNMENTS   /   DRY WALKING TIME</text>
  <text x="329" y="482" fill="#455f61" font-family="DejaVu Sans, sans-serif" font-size="15">Attack spawn</text>
  <text x="527" y="482" fill="#455f61" font-family="DejaVu Sans, sans-serif" font-size="15">Defend spawn</text>
  <text x="44" y="514" fill="#203c40" font-family="DejaVu Serif, serif" font-size="18">Palace Terrace</text>
  <text x="329" y="514" fill="#203c40" font-family="DejaVu Sans Mono, monospace" font-size="16">22.8 s</text>
  <text x="527" y="514" fill="#203c40" font-family="DejaVu Sans Mono, monospace" font-size="16">12.9 s</text>
  <text x="44" y="545" fill="#203c40" font-family="DejaVu Serif, serif" font-size="18">Wind Field</text>
  <text x="329" y="545" fill="#203c40" font-family="DejaVu Sans Mono, monospace" font-size="16">20.6 s</text>
  <text x="527" y="545" fill="#203c40" font-family="DejaVu Sans Mono, monospace" font-size="16">14.6 s</text>
  <text x="44" y="576" fill="#203c40" font-family="DejaVu Serif, serif" font-size="18">Gauge Bridge</text>
  <text x="329" y="576" fill="#203c40" font-family="DejaVu Sans Mono, monospace" font-size="16">13.2 s</text>
  <text x="527" y="576" fill="#203c40" font-family="DejaVu Sans Mono, monospace" font-size="16">15.1 s</text>
  <text x="44" y="607" fill="#455f61" font-family="DejaVu Sans, sans-serif" font-size="14">Centreline estimates at 5 m/s, before peeks, fighting and the final step to the vessel.</text>
  <text x="770" y="225" fill="#203c40" font-family="DejaVu Serif, serif" font-size="22">Seal Die</text>
  <text x="1395" y="225" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="14" text-anchor="end">Palace Terrace</text>
  <text x="770" y="252" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="15">One square die cast into the palace parapet marks A from either ramp.</text>
  <text x="770" y="320" fill="#203c40" font-family="DejaVu Serif, serif" font-size="22">Flood Rule</text>
  <text x="1395" y="320" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="14" text-anchor="end">Gauge Bridge</text>
  <text x="770" y="347" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="15">Twin notched staffs frame the river crossing and show where its dry deck</text>
  <text x="770" y="368" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="15">begins.</text>
  <text x="770" y="415" fill="#203c40" font-family="DejaVu Serif, serif" font-size="22">Wind Fork</text>
  <text x="1395" y="415" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="14" text-anchor="end">Wind Field</text>
  <text x="770" y="442" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="15">Three fixed prongs above the drying wall mark B across the plain.</text>
  <line x1="44" y1="631" x2="1396" y2="631" stroke="#203c40" stroke-width="1.1" />
  <text x="44" y="658" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" letter-spacing="1.25">COVER SCHEDULE   /   FRONT ELEVATIONS FACING NORTH</text>
  <text x="1396" y="658" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="end">Dashed guide at 1.7 m</text>
  <rect x="130.27" y="729.4" width="52.8" height="50.6" fill="#34494c" stroke="#203c40" stroke-width="0.8" />
  <rect x="349" y="727.2" width="66" height="52.8" fill="#34494c" stroke="#203c40" stroke-width="0.8" />
  <rect x="568.83" y="729.4" width="77" height="50.6" fill="#34494c" stroke="#203c40" stroke-width="0.8" />
  <rect x="816.17" y="733.8" width="33" height="46.2" fill="#34494c" stroke="#203c40" stroke-width="0.8" />
  <rect x="1025" y="755.8" width="66" height="24.2" fill="#34494c" stroke="#203c40" stroke-width="0.8" />
  <rect x="1233.83" y="729.4" width="99" height="50.6" fill="#34494c" stroke="#203c40" stroke-width="0.8" />
  <line x1="44" y1="780" x2="1396" y2="780" stroke="#203c40" stroke-width="1" />
  <line x1="44" y1="742.6" x2="1396" y2="742.6" stroke="#a77b5b" stroke-width="1.3" stroke-dasharray="5 4" />
  <text x="156.67" y="804" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">C1   2.3 m high</text>
  <text x="156.67" y="827" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle">Pier Buttress</text>
  <text x="156.67" y="865" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">2.4 × 4 m</text>
  <text x="382" y="804" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">C2   2.4 m high</text>
  <text x="382" y="827" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle">Ledger Screen</text>
  <text x="382" y="865" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">3 × 2.2 m</text>
  <text x="607.33" y="804" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">C3   2.3 m high</text>
  <text x="607.33" y="827" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle">Seal Press</text>
  <text x="607.33" y="865" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">3.5 × 2.2 m</text>
  <text x="832.67" y="804" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">C4   2.1 m high</text>
  <text x="832.67" y="827" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle">Sluice Cheek</text>
  <text x="832.67" y="865" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">1.5 × 3 m</text>
  <text x="1058" y="804" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">C5   1.1 m high</text>
  <text x="1058" y="827" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle">Threshing Bin</text>
  <text x="1058" y="865" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">3 × 2 m</text>
  <text x="1283.33" y="804" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">C6   2.3 m high</text>
  <text x="1283.33" y="827" fill="#203c40" font-family="DejaVu Sans, sans-serif" font-size="15" text-anchor="middle">Drying Wall</text>
  <text x="1283.33" y="865" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" text-anchor="middle">4.5 × 2.4 m</text>
  <line x1="44" y1="883" x2="1396" y2="883" stroke="#a8b8ae" stroke-width="1" />
  <text x="44" y="908" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="13" letter-spacing="1.25">SHOULDER-CAMERA TESTS</text>
  <text x="44" y="939" fill="#203c40" font-family="DejaVu Serif, serif" font-size="20">Porch reveal</text>
  <text x="44" y="963" fill="#455f61" font-family="DejaVu Sans, sans-serif" font-size="14">20.2 m in plan  /  Ledger Screen</text>
  <text x="729" y="939" fill="#203c40" font-family="DejaVu Serif, serif" font-size="20">Sill to ring</text>
  <text x="729" y="963" fill="#455f61" font-family="DejaVu Sans, sans-serif" font-size="14">23.1 m in plan  /  clear in plan</text>
  <line x1="44" y1="984" x2="1396" y2="984" stroke="#203c40" stroke-width="1" />
  <text x="44" y="1009" fill="#455f61" font-family="DejaVu Sans, sans-serif" font-size="14">Test from both ends, both shoulders, and at the near and far lips of the planted vessel.</text>
  <text x="1396" y="1009" fill="#455f61" font-family="DejaVu Sans Mono, monospace" font-size="12" text-anchor="end">Design rehearsal    /    Ember Rite · 5v5</text>
</svg>
