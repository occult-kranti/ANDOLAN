    <text x="485" y="768" font-size="18" font-weight="700" fill="#e9b775">03 / TAIL &amp; ACTION</text>
    <text x="485" y="800" font-size="17">Design a continuous arc; inspect root, bend, tip and clearance during movement.</text>
    <text x="485" y="829" font-size="17">Do not mirror the posed tail, grip, parted hair or combat silhouette automatically.</text>
    <text x="485" y="858" font-size="17">Landmarks are visual guides; model anatomy, skinning and game readability decide.</text>
